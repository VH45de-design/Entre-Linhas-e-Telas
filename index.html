<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, 
          maximum-scale=1.0, user-scalable=no">
    <title>Entre Linhas e Telas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 540px;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            z-index: 100;
        }

        .mobile-btn {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        .mobile-btn:active {
            background: rgba(255,255,255,0.5);
        }

        #btn-left  { left: 20px; bottom: 30px; }
        #btn-right { left: 100px; bottom: 30px; }
        #btn-jump  { right: 20px; bottom: 30px; }
        #btn-action{ right: 100px; bottom: 30px; }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 200;
            transition: opacity 1s;
        }

        #loading h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #4af;
        }

        #loading-bar {
            width: 300px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        #loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4af, #f4a);
            transition: width 0.3s;
        }

        #loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }

        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            #game-container {
                max-width: 100vw;
                max-height: calc(100vh - 120px);
            }
        }
    </style>
</head>
<body>

    <div id="loading">

// SEÇÃO 2: SISTEMA DE SAVE
// ══════════════════════════════════════════════════════

const SaveSystem = {
    saveKey: 'entreLinhasETelas_save',
    saveBlocked: false,
    blockReason: '',

    defaultData: {
        currentPhase: 0,
        playerHealth: 100,
        playerMaxHealth: 100,
        playerX: 100,
        playerY: 300,
        boss1Defeated: false,
        boss2Defeated: false,
        boss3Defeated: false,
        finalBossDefeated: false,
        boss1Mercy: false,
        boss2Mercy: false,
        boss3Mercy: false,
        finalBossMercy: false,
        finalBossTrust: 0,
        dialoguesSeen: {},
        checkpoints: {},
        preBossSaved: {},
        totalDeaths: 0,
        totalPlayTime: 0,
        achievements: {},
        musicVolume: 0.7,
        sfxVolume: 0.8
    },

    data: null,

    init() {
        this.load();
    },

    save() {
        if (this.saveBlocked) {
            console.log('⚠️ ' + this.blockReason);
            DialogueSystem.showQuick(this.blockReason);
            return false;
        }
        try {
            localStorage.setItem(this.saveKey, JSON.stringify(this.data));
            console.log('✅ Jogo salvo!');
            return true;
        } catch(e) {
            console.error('❌ Erro ao salvar:', e);
            return false;
        }
    },

    load() {
        try {
            const saved = localStorage.getItem(this.saveKey);
            if (saved) {
                this.data = {...this.defaultData, ...JSON.parse(saved)};
                console.log('✅ Save carregado!');
            } else {
                this.newGame();
            }
        } catch(e) {
            this.newGame();
        }
    },

    newGame() {
        this.data = {...this.defaultData};
        console.log('🆕 Novo jogo!');
    },

    deleteSave() {
        localStorage.removeItem(this.saveKey);
        this.newGame();
    },

    hasSave() {
        return localStorage.getItem(this.saveKey) !== null;
    },

    blockSave(reason) {
        this.saveBlocked = true;
        this.blockReason = reason;
    },

    unblockSave() {
        this.saveBlocked = false;
        this.blockReason = '';
    },

    saveBeforeBoss(bossIndex) {
        const wasBlocked = this.saveBlocked;
        this.saveBlocked = false;
        this.data.preBossSaved[bossIndex] = true;
        this.data.playerHealth = this.data.playerMaxHealth;
        this.save();
        this.saveBlocked = wasBlocked;
        DialogueSystem.showQuick('💾 Save automático antes da batalha!');
        EffectsSystem.spawnSaveEffect(player.x, player.y);
    },

    setBossDefeated(index, mercy) {
        const keys = ['boss1Defeated','boss2Defeated','boss3Defeated','finalBossDefeated'];
        const mercyKeys = ['boss1Mercy','boss2Mercy','boss3Mercy','finalBossMercy'];
        if (index < keys.length) {
            this.data[keys[index]] = true;
            this.data[mercyKeys[index]] = mercy;
            this.data.currentPhase = index + 1;
        }
        const wasBlocked = this.saveBlocked;
        this.saveBlocked = false;
        this.save();
        this.saveBlocked = wasBlocked;
    }
};

// ══════════════════════════════════════════════════════
// SEÇÃO 3: SISTEMA DE ÁUDIO
// ══════════════════════════════════════════════════════

const AudioSystem = {
    audioCtx: null,
    currentMusic: null,
    musicGain: null,
    sfxGain: null,

    init() {
        try {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            this.musicGain = this.audioCtx.createGain();
            this.musicGain.connect(this.audioCtx.destination);
            this.musicGain.gain.value = SaveSystem.data.musicVolume;
            this.sfxGain = this.audioCtx.createGain();
            this.sfxGain.connect(this.audioCtx.destination);
            this.sfxGain.gain.value = SaveSystem.data.sfxVolume;
        } catch(e) {
            console.log('⚠️ Web Audio não suportado');
        }
    },

    resume() {
        if (this.audioCtx && this.audioCtx.state === 'suspended')
            this.audioCtx.resume();
    },

    // Gera tom simples (substitui arquivos de áudio)
    playTone(freq, duration, type = 'square', volume = 0.3) {
        if (!this.audioCtx) return;
        try {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = volume * SaveSystem.data.sfxVolume;
            gain.gain.exponentialRampToValueAtTime(0.001, 
                this.audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start();
            osc.stop(this.audioCtx.currentTime + duration);
        } catch(e) {}
    },

    playJump()     { this.playTone(400, 0.1, 'square', 0.2); 
                     this.playTone(600, 0.1, 'square', 0.2); },
    playHit()      { this.playTone(150, 0.2, 'sawtooth', 0.3); },
    playSelect()   { this.playTone(800, 0.05, 'square', 0.15); },
    playDialogue() { this.playTone(500 + Math.random()*200, 0.03, 'square', 0.1); },
    playBullet()   { this.playTone(200, 0.1, 'sawtooth', 0.15); },
    playBossHit()  { this.playTone(100, 0.3, 'sawtooth', 0.4); },
    playTrust()    { this.playTone(600, 0.1, 'sine', 0.2); 
                     setTimeout(() => this.playTone(800, 0.15, 'sine', 0.2), 100); },
    playSave()     { this.playTone(523, 0.1, 'sine', 0.2); 
                     setTimeout(() => this.playTone(659, 0.1, 'sine', 0.2), 100);
                     setTimeout(() => this.playTone(784, 0.15, 'sine', 0.2), 200); },
    playDeath()    { this.playTone(300, 0.3, 'sawtooth', 0.3);
                     setTimeout(() => this.playTone(200, 0.3, 'sawtooth', 0.3), 300);
                     setTimeout(() => this.playTone(100, 0.5, 'sawtooth', 0.3), 600); },
    playVictory()  { [523,659,784,1047].forEach((f,i) => 
                     setTimeout(() => this.playTone(f, 0.2, 'sine', 0.3), i*150)); },

    // Música procedural simples (loop)
    musicInterval: null,
    currentTrack: '',

    playMusic(track) {
        this.stopMusic();
        this.currentTrack = track;

        const patterns = {
            'menu': { notes: [262,330,392,330], tempo: 400, type: 'sine', vol: 0.1 },
            'phase1': { notes: [330,392,440,392,330,262], tempo: 300, type: 'sine', vol: 0.08 },
            'phase2': { notes: [262,294,330,262,220,196], tempo: 350, type: 'triangle', vol: 0.08 },
            'phase3': { notes: [220,262,196,220,175,196], tempo: 500, type: 'sine', vol: 0.06 },
            'phaseFinal': { notes: [330,392,494,392,330,392,494,587], tempo: 250, type: 'triangle', vol: 0.08 },
            'battle': { notes: [330,330,659,494,466,392,330,392], tempo: 150, type: 'square', vol: 0.1 },
            'determination': { notes: [494,494,988,740,698,587,494,587], tempo: 200, type: 'square', vol: 0.12 },
            'victory': { notes: [523,523,523,523,415,466,523,466,523], tempo: 200, type: 'sine', vol: 0.1 },
            'gameover': { notes: [262,247,220,196], tempo: 600, type: 'triangle', vol: 0.08 }
        };

        const p = patterns[track];
        if (!p) return;

        let noteIndex = 0;
        this.musicInterval = setInterval(() => {
            this.playTone(p.notes[noteIndex % p.notes.length], p.tempo/1000 * 0.8, p.type, p.vol);
            noteIndex++;
        }, p.tempo);
    },

    stopMusic() {
        if (this.musicInterval) {
            clearInterval(this.musicInterval);
            this.musicInterval = null;
        }
        this.currentTrack = '';
    }
};

// ══════════════════════════════════════════════════════
// SEÇÃO 4: SISTEMA DE DIÁLOGO
// ══════════════════════════════════════════════════════

const DialogueSystem = {
    active: false,
    lines: [],
    currentLine: 0,
    displayedText: '',
    fullText: '',
    charIndex: 0,
    typingSpeed: 2,
    speaker: '',
    onComplete: null,
    quickMessage: '',
    quickTimer: 0,
    isQuick: false,

    startDialogue(speaker, lines, onComplete = null) {
        this.active = true;
        this.isQuick = false;
        this.speaker = speaker;
        this.lines = lines;
        this.currentLine = 0;
        this.onComplete = onComplete;
        this.startLine(lines[0]);
        gameState = 'dialogue';
    },

    startLine(text) {
        this.fullText = text;
        this.displayedText = '';
        this.charIndex = 0;
    },

    showQuick(message) {
        this.quickMessage = message;
        this.quickTimer = 180; // 3 segundos
        this.isQuick = true;
    },

    update() {
        // Quick message
        if (this.isQuick && this.quickTimer > 0) {
            this.quickTimer--;
            if (this.quickTimer <= 0) this.isQuick = false;
        }

        if (!this.active) return;

        // Typing
        if (this.charIndex < this.fullText.length) {
            if (frameCount % this.typingSpeed === 0) {
                this.displayedText += this.fullText[this.charIndex];
                this.charIndex++;
                if (this.fullText[this.charIndex-1] !== ' ')
                    AudioSystem.playDialogue();
            }
        }
    },

    nextLine() {
        if (this.charIndex < this.fullText.length) {
            this.displayedText = this.fullText;
            this.charIndex = this.fullText.length;
            return;
        }

        this.currentLine++;
        if (this.currentLine < this.lines.length) {
            this.startLine(this.lines[this.currentLine]);
        } else {
            this.close();
        }
    },

    close() {
        this.active = false;
        gameState = 'playing';
        if (this.onComplete) this.onComplete();
    },

    draw(ctx) {
        // Quick message
        if (this.isQuick && this.quickTimer > 0) {
            const alpha = Math.min(1, this.quickTimer / 30);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fillRect(100, 20, GAME_CONFIG.width - 200, 50);
            ctx.strokeStyle = '#4af';
            ctx.lineWidth = 2;
            ctx.strokeRect(100, 20, GAME_CONFIG.width - 200, 50);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText(this.quickMessage, GAME_CONFIG.width/2, 50);
            ctx.restore();
        }

        if (!this.active) return;

        // Dialogue box
        const boxY = GAME_CONFIG.height - 140;
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(50, boxY, GAME_CONFIG.width - 100, 120);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(50, boxY, GAME_CONFIG.width - 100, 120);

        // Speaker name
        if (this.speaker) {
            ctx.fillStyle = '#4af';
            ctx.font = 'bold 16px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(this.speaker, 70, boxY + 25);
        }

        // Text
        ctx.fillStyle = '#fff';
        ctx.font = '14px Courier New';
        ctx.textAlign = 'left';

        const words = this.displayedText.split(' ');
        let line = '';
        let y = boxY + 50;
        const maxWidth = GAME_CONFIG.width - 160;

        for (const word of words) {
            const test = line + word + ' ';
            if (ctx.measureText(test).width > maxWidth) {
                ctx.fillText(line, 70, y);
                line = word + ' ';
                y += 20;
            } else {
                line = test;
            }
        }
        ctx.fillText(line, 70, y);

        // Continue indicator
        if (this.charIndex >= this.fullText.length) {
            ctx.fillStyle = '#4af';
            ctx.font = '12px Courier New';
            ctx.textAlign = 'right';
            const blink = Math.sin(Date.now() / 300) > 0;
            if (blink) ctx.fillText('▼ Continuar', GAME_CONFIG.width - 70, boxY + 105);
        }
    }
};

    unlock(id) {

        SaveSystem.data.achievements[id] = true;

            this.notification = a;

            AudioSystem.playVictory();

    isUnlocked(id) {
        return SaveSystem.data.achievements[id] === true;
    },

    getUnlockedCount() {
        return Object.keys(SaveSystem.data.achievements).filter(
            k => SaveSystem.data.achievements[k]).length;
    },

    update() {
        if (this.notifTimer > 0) this.notifTimer--;

// ══════════════════════════════════════════════════════
// SEÇÃO 6: SISTEMA DE EFEITOS
// ══════════════════════════════════════════════════════

const EffectsSystem = {
    particles: [],

    spawnHit(x, y, color = '#ff3333') {
        for (let i = 0; i < 8; i++) {
            const angle = (Math.PI * 2 / 8) * i;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * (2 + Math.random()*3),
                vy: Math.sin(angle) * (2 + Math.random()*3),
                size: 3 + Math.random()*3,
                color,
                life: 30,
                maxLife: 30
            });
        }
    },

    spawnDeath(x, y, color = '#ff3333') {
        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 5;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                size: 2 + Math.random()*5,
                color,
                life: 40 + Math.random()*20,
                maxLife: 60,
                gravity: 0.1
            });
        }
    },

    spawnSaveEffect(x, y) {
        for (let i = 0; i < 12; i++) {
            const angle = (Math.PI * 2 / 12) * i;
            this.particles.push({
                x: x + Math.cos(angle) * 20,
                y: y + Math.sin(angle) * 20,
                vx: Math.cos(angle) * 1,
                vy: Math.sin(angle) * 1 - 1,
                size: 3,
                color: '#ffcc33',
                life: 40,
                maxLife: 40
            });
        }
        AudioSystem.playSave();
    },

    spawnAchievement(x, y) {
        const colors = ['#ffcc33','#fff','#ff8833','#33ccff'];
        for (let i = 0; i < 20; i++) {
            this.particles.push({
                x: x + (Math.random()-0.5)*40,
                y,
                vx: (Math.random()-0.5) * 4,
                vy: -3 - Math.random()*5,
                size: 2 + Math.random()*4,
                color: colors[Math.floor(Math.random()*colors.length)],
                life: 50,
                maxLife: 50,
                gravity: 0.15
            });
        }
    },

    update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.gravity) p.vy += p.gravity;
            p.life--;
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    draw(ctx) {
        for (const p of this.particles) {
            ctx.globalAlpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.globalAlpha = 1;
    }
};

const player = {
    x: 100, y: 300,
    width: 24, height: 40,
    vx: 0, vy: 0,
    speed: 4,
    jumpForce: -10,
    health: 100,
    maxHealth: 100,
    isGrounded: false,
    isDead: false,
    facingRight: true,
    invincible: false,
    invincibleTimer: 0,
    walkFrame: 0,

    reset() {
        this.x = 100;
        this.y = 300;
        this.vx = 0;
        this.vy = 0;
        this.health = this.maxHealth;
        this.isDead = false;
        this.invincible = false;
    },

    update(platforms) {
        if (this.isDead) return;
        if (gameState === 'battle' || gameState === 'cutscene') return;

        // Movement
        if (KEYS.left) {
            this.vx = -this.speed;
            this.facingRight = false;
        } else if (KEYS.right) {
            this.vx = this.speed;
            this.facingRight = true;
        } else {
            this.vx = 0;
        }

        // Jump
        if (KEYS.jump && this.isGrounded) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
            AudioSystem.playJump();
        }

        // Gravity
        this.vy += GAME_CONFIG.gravity;

        // Move
        this.x += this.vx;
        this.y += this.vy;

        // Walk animation
        if (Math.abs(this.vx) > 0.1) {
            this.walkFrame += 0.15;
        } else {
            this.walkFrame = 0;
        }

        // Platform collision
        this.isGrounded = false;
        for (const p of platforms) {
            if (this.x + this.width > p.x &&
                this.x < p.x + p.width &&
                this.y + this.height > p.y &&
                this.y + this.height < p.y + p.height + 10 &&
                this.vy >= 0)
            {
                this.y = p.y - this.height;
                this.vy = 0;
                this.isGrounded = true;
            }
        }

        // World bounds
        if (this.x < 0) this.x = 0;
        if (this.x > GAME_CONFIG.width - this.width)
            this.x = GAME_CONFIG.width - this.width;
        if (this.y > GAME_CONFIG.height + 50) this.die();

        // Invincibility
        if (this.invincible) {
            this.invincibleTimer--;
            if (this.invincibleTimer <= 0) this.invincible = false;
        }
    },

    takeDamage(amount) {
        if (this.invincible || this.isDead) return;
        this.health -= amount;
        this.invincible = true;
        this.invincibleTimer = 60;
        AudioSystem.playHit();
        EffectsSystem.spawnHit(this.x + this.width/2, this.y + this.height/2);

        if (this.health / this.maxHealth <= 0.1)
            AchievementSystem.unlock('survivor');

        if (this.health <= 0) this.die();
    },

    heal(amount) {
        this.health = Math.min(this.health + amount, this.maxHealth);
    },

    die() {
        this.isDead = true;
        this.health = 0;
        AudioSystem.playDeath();
        EffectsSystem.spawnDeath(this.x + this.width/2, this.y + this.height/2);
        SaveSystem.data.totalDeaths++;

        if (gameState === 'battle') {
            BattleSystem.onPlayerDeath();
        } else {
            setTimeout(() => changeScene('death'), 1500);
        }
    },

    draw(ctx) {
        if (this.isDead) return;

        // Blink when invincible
        if (this.invincible && frameCount % 6 < 3) return;

        ctx.save();
        const flip = this.facingRight ? 1 : -1;
        ctx.translate(this.x + this.width/2, this.y);
        ctx.scale(flip, 1);

        const legSwing = Math.sin(this.walkFrame * 8) * 4;
        const armSwing = Math.sin(this.walkFrame * 8) * 3;
        const breathe = Math.sin(Date.now()/500) * 0.5;

        // Backpack
        ctx.fillStyle = '#993333';
        ctx.fillRect(-15, 5 + breathe, 10, 20);

        // Legs
        ctx.fillStyle = COLORS.pants;
        ctx.fillRect(-7, 25, 6, 15 + legSwing);
        ctx.fillRect(1, 25, 6, 15 - legSwing);

        // Shoes
        ctx.fillStyle = COLORS.shoe;
        ctx.fillRect(-8, 38 + legSwing, 8, 4);
        ctx.fillRect(0, 38 - legSwing, 8, 4);

        // Body
        ctx.fillStyle = COLORS.shirt;
        ctx.fillRect(-9, 5 + breathe, 18, 22);

        // Shirt stripe
        ctx.fillStyle = '#2255aa';
        ctx.fillRect(-9, 14 + breathe, 18, 3);

        // Collar
        ctx.fillStyle = '#ddd';
        ctx.fillRect(-5, 5 + breathe, 10, 3);

        // Arms
        ctx.fillStyle = COLORS.shirt;
        ctx.fillRect(-13, 8 + breathe + armSwing, 5, 16);
        ctx.fillRect(8, 8 + breathe - armSwing, 5, 16);

        // Hands
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-13, 22 + breathe + armSwing, 5, 5);
        ctx.fillRect(8, 22 + breathe - armSwing, 5, 5);

        // Head
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-9, -12, 18, 18);

        // Hair
        ctx.fillStyle = COLORS.hair;
        ctx.fillRect(-10, -14, 20, 6);
        ctx.fillRect(-10, -10, 6, 5); // fringe

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, -6, 5, 5);
        ctx.fillRect(1, -6, 5, 5);
        ctx.fillStyle = '#3388ff';
        ctx.fillRect(-5, -5, 3, 3);
        ctx.fillRect(2, -5, 3, 3);

        // Eyebrows
        ctx.fillStyle = COLORS.hair;
        ctx.fillRect(-6, -8, 5, 1);
        ctx.fillRect(1, -8, 5, 1);

        // Mouth
        ctx.fillStyle = '#cc6666';
        ctx.fillRect(-2, 1, 4, 1);

        // Ears
        ctx.fillStyle = COLORS.skin;
        ctx.fillRect(-11, -6, 3, 5);
        ctx.fillRect(8, -6, 3, 5);

        ctx.restore();
    }
};

const soul = {
    x: GAME_CONFIG.width/2,
    y: GAME_CONFIG.height/2,
    size: 12,
    speed: 4,
    active: false,
    pulsePhase: 0,

    // Battle box bounds
    boxX: 280, boxY: 120,
    boxW: 400, boxH: 250,

    activate(x, y) {
        this.x = x || this.boxX + this.boxW/2;
        this.y = y || this.boxY + this.boxH/2;
        this.active = true;
    },

    deactivate() {
        this.active = false;
    },

    update() {
        if (!this.active) return;

        let dx = 0, dy = 0;
        if (KEYS.left) dx = -this.speed;
        if (KEYS.right) dx = this.speed;
        if (KEYS.up) dy = -this.speed;
        if (KEYS.down) dy = this.speed;

        // Normalize diagonal
        if (dx !== 0 && dy !== 0) {
            dx *= 0.707;
            dy *= 0.707;
        }

        this.x += dx;
        this.y += dy;

        // Clamp to battle box
        this.x = Math.max(this.boxX + this.size, Math.min(this.boxX + this.boxW - this.size, this.x));
        this.y = Math.max(this.boxY + this.size, Math.min(this.boxY + this.boxH - this.size, this.y));

        this.pulsePhase += 0.1;
    },

    draw(ctx) {
        if (!this.active) return;

        const pulse = 1 + Math.sin(this.pulsePhase) * 0.15;
        const s = this.size * pulse;

        // Glow
        ctx.fillStyle = 'rgba(255,50,80,0.2)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, s * 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Heart shape (simple diamond)
        ctx.fillStyle = '#ff1144';
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(Math.PI/4);
        ctx.fillRect(-s/2, -s/2, s, s);
        ctx.restore();

        // Shine
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(this.x - s/4, this.y - s/3, s/4, s/4);
    },

    checkCollision(bullet) {
        const dx = this.x - bullet.x;
        const dy = this.y - bullet.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        return dist < this.size + bullet.size;
    }
};

const BattleSystem = {
    active: false,
    boss: null,
    bullets: [],
    isPlayerTurn: true,
    enemyTurnTimer: 0,
    enemyTurnDuration: 300,
    selectedAction: 0,
    actions: ['ATACAR', 'FALAR', 'AGIR', 'MERCY'],
    tookDamageThisBoss: false,
    attackedFinalBoss: false,
    actCountFinal: 0,

    buttons: [
        { x: 170, y: 410, w: 120, h: 40, label: 'ATACAR', color: '#ff4444' },
        { x: 320, y: 410, w: 120, h: 40, label: 'FALAR', color: '#44aaff' },
        { x: 470, y: 410, w: 120, h: 40, label: 'AGIR', color: '#ffaa44' },
        { x: 620, y: 410, w: 120, h: 40, label: 'MERCY', color: '#44ff88' }
    ],

    startBattle(boss) {
        this.active = true;
        this.boss = boss;
        this.bullets = [];
        this.isPlayerTurn = true;
        this.tookDamageThisBoss = false;
        this.attackedFinalBoss = false;
        this.actCountFinal = 0;

        gameState = 'battle';
        SaveSystem.blockSave('Não é possível salvar durante a batalha!');

        soul.activate();

        if (boss.name === 'Lucas') {
            AudioSystem.playMusic('determination');
        } else {
            AudioSystem.playMusic('battle');
        }

        DialogueSystem.showQuick('⚔️ ' + boss.name + ' apareceu!');
    },

    endBattle() {
        this.active = false;
        this.bullets = [];
        soul.deactivate();
        gameState = 'playing';
        SaveSystem.unblockSave();

        // Auto save after battle
        setTimeout(() => {
            if (!SaveSystem.saveBlocked) {
                SaveSystem.save();
                DialogueSystem.showQuick('💾 Progresso salvo!');
            }
        }, 1000);
    },

    onPlayerDeath() {
        this.active = false;
        this.bullets = [];
        soul.deactivate();
        SaveSystem.unblockSave();
        SaveSystem.data.totalDeaths++;
        setTimeout(() => changeScene('death'), 1500);
    },

    playerAttack() {
        if (!this.isPlayerTurn) return;
        this.boss.takeDamage(15);
        if (this.boss.name === 'Lucas') {
            this.attackedFinalBoss = true;
        }
        this.startEnemyTurn();
    },

    playerTalk() {
        if (!this.isPlayerTurn) return;
        this.boss.onTalk();
        this.startEnemyTurn();
    },

    playerAct() {
        if (!this.isPlayerTurn) return;
        this.boss.onAct();
        if (this.boss.name === 'Lucas') {
            this.actCountFinal++;
            if (this.actCountFinal >= 10)
                AchievementSystem.unlock('oldMemories');
        }
        this.startEnemyTurn();
    },

    playerMercy() {
        if (!this.isPlayerTurn) return;
        this.boss.onMercy();
        if (!this.active) return; // Boss may have ended battle
        this.startEnemyTurn();
    },

    startEnemyTurn() {
        this.isPlayerTurn = false;
        this.enemyTurnTimer = this.enemyTurnDuration;
        soul.activate();
    },

    update() {
        if (!this.active) return;

        soul.update();

        // Enemy turn
        if (!this.isPlayerTurn) {
            this.enemyTurnTimer--;

            // Boss attacks
            this.boss.attack(this.bullets);

            // Update bullets
            for (let i = this.bullets.length - 1; i >= 0; i--) {
                const b = this.bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                b.life--;

                // Check collision with soul
                if (soul.checkCollision(b)) {
                    player.takeDamage(10);
                    this.tookDamageThisBoss = true;
                    this.bullets.splice(i, 1);
                    continue;
                }

                // Remove dead bullets
                if (b.life <= 0 ||
                    b.x < soul.boxX - 50 || b.x > soul.boxX + soul.boxW + 50 ||
                    b.y < soul.boxY - 50 || b.y > soul.boxY + soul.boxH + 50) {
                    this.bullets.splice(i, 1);
                }
            }

            // End enemy turn
            if (this.enemyTurnTimer <= 0) {
                this.isPlayerTurn = true;
                this.bullets = [];
            }
        }
    },

    handleClick(mx, my) {
        if (!this.isPlayerTurn) return;

        for (let i = 0; i < this.buttons.length; i++) {
            const b = this.buttons[i];
            if (mx >= b.x && mx <= b.x + b.w &&
                my >= b.y && my <= b.y + b.h) {
                AudioSystem.playSelect();
                switch(i) {
                    case 0: this.playerAttack(); break;
                    case 1: this.playerTalk(); break;
                    case 2: this.playerAct(); break;
                    case 3: this.playerMercy(); break;
                }
            }
        }
    },

    draw(ctx) {
        if (!this.active) return;

        // Battle box
        ctx.fillStyle = 'rgba(0,0,0,0.95)';
        ctx.fillRect(soul.boxX - 5, soul.boxY - 5, soul.boxW + 10, soul.boxH + 10);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.strokeRect(soul.boxX, soul.boxY, soul.boxW, soul.boxH);

        // Boss info
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(this.boss.name, GAME_CONFIG.width/2, 30);

        // Boss HP bar
        const hpPercent = this.boss.health / this.boss.maxHealth;
        ctx.fillStyle = '#333';
        ctx.fillRect(330, 40, 300, 15);
        ctx.fillStyle = hpPercent > 0.5 ? '#44ff44' :
                        hpPercent > 0.25 ? '#ffaa44' : '#ff4444';
        ctx.fillRect(330, 40, 300 * hpPercent, 15);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(330, 40, 300, 15);

        // HP text
        ctx.font = '12px Courier New';
        ctx.fillStyle = '#fff';
        ctx.fillText(`HP: ${this.boss.health}/${this.boss.maxHealth}`,
            GAME_CONFIG.width/2, 80);

        // Trust bar (final boss only)
        if (this.boss.trustPoints !== undefined) {
            const trustPercent = this.boss.trustPoints / this.boss.trustRequired;
            ctx.fillStyle = '#333';
            ctx.fillRect(330, 90, 300, 10);
            ctx.fillStyle = '#ffcc33';
            ctx.fillRect(330, 90, 300 * trustPercent, 10);
            ctx.strokeStyle = '#ffcc33';
            ctx.strokeRect(330, 90, 300, 10);
            ctx.font = '11px Courier New';
            ctx.fillStyle = '#ffcc33';
            ctx.fillText(`Confiança: ${Math.round(trustPercent*100)}%`,
                GAME_CONFIG.width/2, 115);
        }

        // Boss visual
        this.boss.draw(ctx);

        // Bullets
        for (const b of this.bullets) {
            ctx.fillStyle = b.color || '#ff4444';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size || 4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Soul
        soul.draw(ctx);

        // Action buttons (player turn only)
        if (this.isPlayerTurn) {
            for (const btn of this.buttons) {
                // Hover detection
                const hover = mouseX >= btn.x && mouseX <= btn.x + btn.w &&
                              mouseY >= btn.y && mouseY <= btn.y + btn.h;

                ctx.fillStyle = hover ? btn.color : 'rgba(0,0,0,0.8)';
                ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                ctx.strokeStyle = btn.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

                ctx.fillStyle = hover ? '#000' : btn.color;
                ctx.font = 'bold 14px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(btn.label, btn.x + btn.w/2, btn.y + btn.h/2 + 5);
            }

            ctx.fillStyle = '#888';
            ctx.font = '12px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('Escolha sua ação', GAME_CONFIG.width/2, 475);
        } else {
            ctx.fillStyle = '#ff4444';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ DESVIE DOS ATAQUES! ⚠️', GAME_CONFIG.width/2, 440);
        }

        // Player HP
        ctx.fillStyle = '#333';
        ctx.fillRect(50, 490, 200, 15);
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(50, 490, 200 * (player.health / player.maxHealth), 15);
        ctx.strokeStyle = '#fff';
        ctx.strokeRect(50, 490, 200, 15);
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier New';
        ctx.textAlign = 'left';
        ctx.fillText(`❤️ ${player.health}/${player.maxHealth}`, 55, 525);
    }
};

function showBossStory(boss, mercy) {
    const story = mercy ? boss.mercyStory : boss.deathStory;
    const title = mercy
        ? `A Redenção de ${boss.name}`
        : `O Fim de ${boss.name}`;

    gameState = 'story';

    currentStory = {
        title,
        lines: story,
        currentLine: 0,
        timer: 0,
        displayedLines: [],
        boss,
        mercy,
        complete: false
    };
}

let currentStory = null;

function updateStory() {
    if (!currentStory || currentStory.complete) return;

    currentStory.timer++;

    if (currentStory.timer % 120 === 0 &&
        currentStory.currentLine < currentStory.lines.length) {
        currentStory.displayedLines.push(
            currentStory.lines[currentStory.currentLine]);
        currentStory.currentLine++;
    }

    if (currentStory.currentLine >= currentStory.lines.length &&
        currentStory.timer > currentStory.lines.length * 120 + 120) {
        currentStory.complete = true;
    }
}

function drawStory(ctx) {
    if (!currentStory) return;

    ctx.fillStyle = 'rgba(0,0,0,0.95)';
    ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

    // Title
    ctx.fillStyle = currentStory.mercy ? '#44ff88' : '#ff4444';
    ctx.font = 'bold 24px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(currentStory.title, GAME_CONFIG.width/2, 60);

    // Boss drawing
    currentStory.boss.draw(ctx);

    // Story lines
    ctx.fillStyle = '#fff';
    ctx.font = '16px Courier New';
    currentStory.displayedLines.forEach((line, i) => {
        ctx.fillText(line, GAME_CONFIG.width/2, 300 + i * 30);
    });

    // Continue prompt
    if (currentStory.complete) {
        const blink = Math.sin(Date.now()/400) > 0;
        if (blink) {
            ctx.fillStyle = '#4af';
            ctx.font = '14px Courier New';
            ctx.fillText('Clique para continuar →',
                GAME_CONFIG.width/2, GAME_CONFIG.height - 40);
        }
    }
}

function clickStory() {
    if (currentStory && currentStory.complete) {
        currentStory = null;
        gameState = 'playing';

        // Transition to next phase
        const phase = SaveSystem.data.currentPhase;
        if (phase >= 4) {
            changeScene('credits');
        } else {
            showCutscene(phase);
        }
    }
}

        lines: CUTSCENES[key],
        currentLine: 0,
        phase: phaseIndex

    gameState = 'cutscene';
    DialogueSystem.startDialogue(
        cutsceneData.lines[0].speaker,
        cutsceneData.lines.map(l => (l.speaker ? l.speaker + ': ' : '') + l.text),
        () => {
            cutsceneData = null;
            // Load next phase

                s.y = 0;
                s.x = Math.random() * GAME_CONFIG.width;
            }
        }
    },

    draw(ctx) {
        // Background
        ctx.fillStyle = '#0a0a2e';
        ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

        // Stars
        for (const s of this.stars) {
            ctx.fillStyle = `rgba(200,220,255,${0.3 + Math.sin(Date.now()/500 + s.x)*0.3})`;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }

        // Title
        ctx.fillStyle = '#4af';
        ctx.font = 'bold 36px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('ENTRE LINHAS', GAME_CONFIG.width/2, 120);
        ctx.fillText('E TELAS', GAME_CONFIG.width/2, 165);

        // Subtitle
        ctx.fillStyle = '#888';
        ctx.font = '14px Courier New';
        ctx.fillText('Uma história sobre conexões perdidas',
            GAME_CONFIG.width/2, 200);

        // Buttons
        for (const btn of this.buttons) {
            const hover = mouseX >= btn.x && mouseX <= btn.x + btn.w &&
                          mouseY >= btn.y && mouseY <= btn.y + btn.h;

            if (btn.action === 'continue' && !SaveSystem.hasSave()) {
                ctx.fillStyle = 'rgba(50,50,50,0.5)';
                ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
                ctx.fillStyle = '#555';
                ctx.font = '16px Courier New';
                ctx.fillText(btn.text, btn.x + btn.w/2, btn.y + btn.h/2 + 6);
                continue;
            }

            ctx.fillStyle = hover ? '#4af' : 'rgba(0,0,0,0.7)';
            ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
            ctx.strokeStyle = '#4af';
            ctx.lineWidth = 2;
            ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);
            ctx.fillStyle = hover ? '#000' : '#4af';
            ctx.font = 'bold 16px Courier New';
            ctx.fillText(btn.text, btn.x + btn.w/2, btn.y + btn.h/2 + 6);
        }

        // Version
        ctx.fillStyle = '#444';
        ctx.font = '11px Courier New';
        ctx.fillText('v' + GAME_CONFIG.version, GAME_CONFIG.width/2, 520);
    },

    click(mx, my) {
        for (const btn of this.buttons) {
            if (mx >= btn.x && mx <= btn.x + btn.w &&
                my >= btn.y && my <= btn.y + btn.h) {
                AudioSystem.playSelect();
                switch(btn.action) {
                    case 'new':
                        SaveSystem.newGame();
                        showCutscene(0);
                        break;
                    case 'continue':
                        if (SaveSystem.hasSave()) {
                            SaveSystem.load();
                            const p = SaveSystem.data.currentPhase;
                            const phaseScenes = ['phase1','phase2','phase3','phaseFinal'];
                            changeScene(phaseScenes[Math.min(p, 3)] || 'phase1');
                        }
                        break;
                    case 'achievements':
                        changeScene('achievementsScreen');
                        break;
                }
            }
        }
    }
};

// --- PHASE TEMPLATE ---
function createPhaseScene(phaseIndex, bgColor, platformColor, bossCreator, musicTrack) {
    return {
        platforms: [],
        checkpoints: [],
        preBossSave: null,
        lucasNPC: null,
        bossTrigger: null,
        phaseIndex,

        init() {
            player.reset();
            player.x = 50;
            player.y = 300;
            player.health = SaveSystem.data.playerHealth || player.maxHealth;

            AudioSystem.playMusic(musicTrack);

            this.platforms = [
                // Ground
                { x: 0, y: 430, width: GAME_CONFIG.width, height: 110, color: platformColor },
                // Platforms
                { x: 100, y: 350, width: 120, height: 15, color: platformColor },
                { x: 300, y: 310, width: 100, height: 15, color: platformColor },
                { x: 500, y: 280, width: 130, height: 15, color: platformColor },
                { x: 700, y: 330, width: 110, height: 15, color: platformColor },
            ];

            // Normal checkpoint
            this.checkpoints = [
                { x: 200, y: 400, active: false, id: phaseIndex * 3 },
                { x: 500, y: 400, active: false, id: phaseIndex * 3 + 1 }
            ];

            // Pre-boss save point
            this.preBossSave = {
                x: 750, y: 400, active: false, id: phaseIndex
            };

            // Lucas NPC
            this.lucasNPC = {
                x: 650, y: 388, talked: false
            };

            // Boss trigger
            this.bossTrigger = {
                x: 880, y: 380, triggered: false
            };
        },

        update() {
            if (gameState !== 'playing') return;

            player.update(this.platforms);

            // Checkpoints
            for (const cp of this.checkpoints) {
                if (!cp.active &&
                    Math.abs(player.x - cp.x) < 30 &&
                    Math.abs(player.y - cp.y) < 50) {
                    cp.active = true;
                    if (!SaveSystem.saveBlocked) {
                        SaveSystem.data.playerHealth = player.health;
                        SaveSystem.save();
                        DialogueSystem.showQuick('💾 Checkpoint ativado!');
                        AudioSystem.playSave();
                        EffectsSystem.spawnSaveEffect(cp.x, cp.y);
                        SaveSystem.ActivateCheckpoint?.(cp.id);
                    }
                }
            }

            // Pre-boss save
            if (this.preBossSave && !this.preBossSave.active &&
                Math.abs(player.x - this.preBossSave.x) < 30 &&
                Math.abs(player.y - this.preBossSave.y) < 50) {
                this.preBossSave.active = true;
                SaveSystem.saveBeforeBoss(phaseIndex);
                player.heal(player.maxHealth);
                DialogueSystem.showQuick('❤️ Vida restaurada! Prepare-se!');
            }

            // Lucas NPC
            if (this.lucasNPC && !this.lucasNPC.talked &&
                Math.abs(player.x - this.lucasNPC.x) < 40 &&
                Math.abs(player.y - this.lucasNPC.y) < 50 &&
                KEYS.action) {
                this.lucasNPC.talked = true;
                showLucasDialogue(phaseIndex);
            }

            // Boss trigger
            if (this.bossTrigger && !this.bossTrigger.triggered &&
                player.x > this.bossTrigger.x) {
                this.bossTrigger.triggered = true;
                const boss = bossCreator();
                BattleSystem.startBattle(boss);
            }
        },

        draw(ctx) {
            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, GAME_CONFIG.width, GAME_CONFIG.height);

            // Background details based on phase
            drawPhaseBackground(ctx, phaseIndex);

            // Platforms
            for (const p of this.platforms) {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.strokeRect(p.x, p.y, p.width, p.height);
            }

            // Checkpoints
            for (const cp of this.checkpoints) {
                const glow = Math.sin(Date.now()/400) * 0.3;
                ctx.fillStyle = cp.active
                    ? 'rgba(100,100,100,0.5)'
                    : `rgba(255,200,50,${0.7+glow})`;
                ctx.fillRect(cp.x - 8, cp.y - 25, 16, 25);
                ctx.fillStyle = '#fff';
                ctx.font = '10px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(cp.active ? '✓' : '★', cp.x, cp.y - 30);
            }

            // Pre-boss save
            if (this.preBossSave) {
                const glow = Math.sin(Date.now()/300) * 0.3;
                ctx.fillStyle = this.preBossSave.active
                    ? 'rgba(100,100,100,0.5)'
                    : `rgba(255,100,50,${0.8+glow})`;
                ctx.fillRect(this.preBossSave.x - 10, this.preBossSave.y - 30, 20, 30);
                ctx.fillStyle = '#fff';
                ctx.font = '11px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText(
                    this.preBossSave.active ? '✓ SALVO' : '★ BOSS SAVE',
                    this.preBossSave.x, this.preBossSave.y - 35);
            }

            // Lucas NPC
            if (this.lucasNPC) {
                drawLucasNPC(ctx, this.lucasNPC.x, this.lucasNPC.y);
                if (!this.lucasNPC.talked &&
                    Math.abs(player.x - this.lucasNPC.x) < 60) {
                    ctx.fillStyle = '#4af';
                    ctx.font = '12px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('[E] Falar com Lucas',
                        this.lucasNPC.x, this.lucasNPC.y - 50);
                }
            }

            // Boss trigger indicator
            if (this.bossTrigger && !this.bossTrigger.triggered) {
                const pulse = Math.sin(Date.now()/300) > 0;
                if (pulse) {
                    ctx.fillStyle = '#ff4444';
                    ctx.font = '12px Courier New';
                    ctx.textAlign = 'center';
                    ctx.fillText('⚠️ BOSS →', this.bossTrigger.x - 30,
                        this.bossTrigger.y - 20);
                }
            }

            // Player
            player.draw(ctx);

            // HUD
            drawHUD(ctx, phaseIndex);
        },

        click(mx, my) {
            if (gameState === 'battle') {
                BattleSystem.handleClick(mx, my);
            }
        }
    };
}

function drawPhaseBackground(ctx, phase) {
    switch(phase) {
        case 0: // City neon
            for (let i = 0; i < 8; i++) {
                const h = 80 + Math.sin(i*2.5)*40;
                ctx.fillStyle = '#0f0f33';
                ctx.fillRect(i*120+10, 430-h, 100, h);
                // Windows
                for (let j = 0; j < 5; j++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#00ccff44' : '#ffcc0044';
                    ctx.fillRect(i*120+20+j*15, 440-h+10+Math.floor(Math.random()*h*0.7), 6, 6);
                }
            }
            break;
        case 1: // Chaotic red
            for (let i = 0; i < 6; i++) {
                ctx.fillStyle = `rgba(200,30,30,${0.1+Math.random()*0.1})`;
                ctx.fillRect(Math.random()*GAME_CONFIG.width-50, Math.random()*300, 200, 20);
            }
            break;
        case 2: // Empty cold
            ctx.fillStyle = 'rgba(100,120,180,0.3)';
            ctx.fillRect(200, 150, 100, 130);
            ctx.fillStyle = 'rgba(100,120,180,0.1)';
            ctx.fillRect(230, 280, 40, 150);
            break;
        case 3: // Tech lab
            ctx.strokeStyle = 'rgba(0,255,100,0.15)';
            ctx.lineWidth = 1;
            for (let x = 0; x < GAME_CONFIG.width; x += 60) {
                ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,GAME_CONFIG.height); ctx.stroke();
            }
            for (let y = 0; y < GAME_CONFIG.height; y += 60) {
                ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(GAME_CONFIG.width,y); ctx.stroke();
            }
            break;
    }
}

function drawLucasNPC(ctx, x, y) {

    ctx.fillRect(x-9, y-9, 18, 22); // body

    ctx.fillStyle = '#00ff66';

    ctx.textAlign = 'center';

}

function changeScene(name) {
    if (scenes[name]) {
        currentScene = scenes[name];
        if (currentScene.init) currentScene.init();
        if (name !== 'death' && name !== 'credits' && name !== 'menu' &&
            name !== 'achievementsScreen')
            gameState = 'playing';
    }
}

function gameLoop(timestamp) {
    deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    frameCount++;

    // Clear
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Update
    if (currentScene?.update) currentScene.update();
    if (gameState === 'battle') BattleSystem.update();
    if (gameState === 'story') updateStory();
    DialogueSystem.update();
    EffectsSystem.update();
    AchievementSystem.update();

    // Draw
    if (currentScene?.draw) currentScene.draw(ctx);
    if (gameState === 'battle') BattleSystem.draw(ctx);
    if (gameState === 'story') drawStory(ctx);
    DialogueSystem.draw(ctx);
    EffectsSystem.draw(ctx);
    AchievementSystem.draw(ctx);

    requestAnimationFrame(gameLoop);
}

function setupInput() {
    // Keyboard
    document.addEventListener('keydown', (e) => {
        AudioSystem.resume();
        switch(e.key) {
            case 'ArrowLeft': case 'a': KEYS.left = true; break;
            case 'ArrowRight': case 'd': KEYS.right = true; break;
            case 'ArrowUp': case 'w': KEYS.up = true; break;
            case 'ArrowDown': case 's': KEYS.down = true; break;
            case ' ': KEYS.jump = true; e.preventDefault(); break;
            case 'e': case 'E': KEYS.action = true; break;
            case 'Escape': KEYS.escape = true; break;
        }

        // Dialogue advance
        if (e.key === ' ' && DialogueSystem.active) {
            DialogueSystem.nextLine();
        }
    });

    document.addEventListener('keyup', (e) => {
        switch(e.key) {
            case 'ArrowLeft': case 'a': KEYS.left = false; break;
            case 'ArrowRight': case 'd': KEYS.right = false; break;
            case 'ArrowUp': case 'w': KEYS.up = false; break;
            case 'ArrowDown': case 's': KEYS.down = false; break;
            case ' ': KEYS.jump = false; break;
            case 'e': case 'E': KEYS.action = false; break;
            case 'Escape': KEYS.escape = false; break;
        }
    });

    // Mouse
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    canvas.addEventListener('click', (e) => {
        AudioSystem.resume();
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
        const my = (e.clientY - rect.top) * (canvas.height / rect.height);

        if (DialogueSystem.active) {
            DialogueSystem.nextLine();
            return;
        }

        if (gameState === 'story') {
            clickStory();
            return;
        }

        if (currentScene?.click) currentScene.click(mx, my);
    });

    // Touch (mobile)
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        AudioSystem.resume();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        mouseX = (touch.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (touch.clientY - rect.top) * (canvas.height / rect.height);

        if (DialogueSystem.active) {
            DialogueSystem.nextLine();
            return;
        }

        if (gameState === 'story') {
            clickStory();
            return;
        }

        if (currentScene?.click) currentScene.click(mouseX, mouseY);
    }, { passive: false });

    // Mobile buttons
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnJump = document.getElementById('btn-jump');
    const btnAction = document.getElementById('btn-action');

    if (btnLeft) {
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); KEYS.left = true; AudioSystem.resume(); }, {passive:false});
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); KEYS.left = false; }, {passive:false});
    }
    if (btnRight) {
        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); KEYS.right = true; AudioSystem.resume(); }, {passive:false});
        btnRight.addEventListener('touchend', (e) => { e.preventDefault(); KEYS.right = false; }, {passive:false});
    }
    if (btnJump) {
        btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); KEYS.jump = true; AudioSystem.resume(); }, {passive:false});
        btnJump.addEventListener('touchend', (e) => { e.preventDefault(); KEYS.jump = false; }, {passive:false});
    }
    if (btnAction) {
        btnAction.addEventListener('touchstart', (e) => { e.preventDefault(); KEYS.action = true; AudioSystem.resume(); }, {passive:false});
        btnAction.addEventListener('touchend', (e) => { e.preventDefault(); KEYS.action = false; }, {passive:false});
    }

    // Detect mobile
    isMobile = 'ontouchstart' in window ||
               navigator.maxTouchPoints > 0;

    if (isMobile) {
        document.getElementById('mobile-controls').style.display = 'block';
    }
}

// ══════════════════════════════════════════════════════
// SEÇÃO 17: INICIALIZAÇÃO
// ══════════════════════════════════════════════════════

function init() {
    // Create canvas
    canvas = document.createElement('canvas');
    canvas.width = GAME_CONFIG.width;
    canvas.height = GAME_CONFIG.height;
    document.getElementById('game-container').appendChild(canvas);
    ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Init systems
    SaveSystem.init();
    AudioSystem.init();

    // Setup input
    setupInput();

    // Hide loading screen
    const loadingFill = document.getElementById('loading-fill');
    const loadingText = document.getElementById('loading-text');

    let progress = 0;
    const loadInterval = setInterval(() => {
        progress += 10;
        loadingFill.style.width = progress + '%';
        loadingText.textContent = `Carregando... ${progress}%`;

        if (progress >= 100) {
            clearInterval(loadInterval);
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    changeScene('menu');
                    gameState = 'menu';
                    requestAnimationFrame(gameLoop);
                }, 1000);
            }, 500);
        }
    }, 100);
}

// Start when page loads
window.addEventListener('load', init);

    </script>
