const AU={
  x:null,
  init(){try{this.x=new(window.AudioContext||window.webkitAudioContext)}catch(e){}},
  res(){if(this.x&&this.x.state==="suspended")this.x.resume()},
  t(f=440,d=.08,tp="square",v=.02){
    if(!this.x)return;const o=this.x.createOscillator(),g=this.x.createGain();
    o.type=tp;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.0001,this.x.currentTime+d);
    o.connect(g);g.connect(this.x.destination);o.start();o.stop(this.x.currentTime+d)
  },
  sel(){this.t(700,.04,"square",.025)},
  hit(){this.t(120,.16,"sawtooth",.04)},
  txt(){this.t(480+Math.random()*140,.025,"square",.012)},
  mrc(){this.t(560,.07,"sine",.03);setTimeout(()=>this.t(760,.1,"sine",.03),70)},
  sv(){this.t(523,.06,"sine",.025);setTimeout(()=>this.t(659,.06,"sine",.025),60);setTimeout(()=>this.t(784,.12,"sine",.025),120)},

  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.t(f,.2,"sine",.03),i*150))},
  lvl(){this.t(440,.05,"sine",.02);setTimeout(()=>this.t(554,.05,"sine",.02),50);setTimeout(()=>this.t(659,.1,"sine",.02),100)},

  miss(){this.t(150,.15,"triangle",.025)},
  soulChange(){this.t(400,.06,"sine",.025);setTimeout(()=>this.t(600,.08,"sine",.025),80)},
  mi:null,mt:"",
  playM(track){
    this.stopM();this.mt=track;
    const patterns={
      menu:{n:[262,330,392,330,262,220],t:400,tp:"sine",v:.008},
      world1:{n:[330,392,440,392,330,262,294,330],t:280,tp:"sine",v:.007},

      sad:{n:[262,247,220,196,175,196,220,196],t:500,tp:"triangle",v:.006}
    };
    const p=patterns[track];if(!p)return;let i=0;
    this.mi=setInterval(()=>{this.t(p.n[i%p.n.length],p.t/1000*.8,p.tp,p.v);i++},p.t)
  },
  stopM(){if(this.mi){clearInterval(this.mi);this.mi=null;this.mt=""}}
};

// ════════ UTILS ════════
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function cText(t,y,s=16,c="#fff"){cx.fillStyle=c;cx.font=s+"px monospace";cx.textAlign="center";cx.fillText(t,W/2,y);cx.textAlign="left"}
function box(x,y,w,h,f="#000",s="#fff",lw=2){cx.fillStyle=f;cx.fillRect(x,y,w,h);cx.strokeStyle=s;cx.lineWidth=lw;cx.strokeRect(x,y,w,h)}
function px(map,ox,oy,sc,pal,flip=false){
  for(let r=0;r<map.length;r++)for(let c=0;c<map[r].length;c++){
    const ch=map[r][c];if(ch==="."||!pal[ch])continue;cx.fillStyle=pal[ch];
    const dx=flip?(map[r].length-1-c):c;cx.fillRect(Math.round(ox+dx*sc),Math.round(oy+r*sc),sc,sc)
  }
}
function wrapT(t,x,y,mw,lh){const w=t.split(" ");let l="";for(let i=0;i<w.length;i++){const test=l+w[i]+" ";if(cx.measureText(test).width>mw&&i>0){cx.fillText(l,x,y);l=w[i]+" ";y+=lh}else l=test}cx.fillText(l,x,y)}
function updateFade(){if(fadeD>0)fadeA=Math.min(1,fadeA+.025);else if(fadeD<0)fadeA=Math.max(0,fadeA-.025)}
function drawFade(){if(fadeA>.01){cx.fillStyle=`rgba(0,0,0,${fadeA})`;cx.fillRect(0,0,W,H)}}

  p:[],

      const a=Math.random()*Math.PI*2;
      const s=Math.random()*spd+1;
      this.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life+Math.random()*15,ml:life+15,s:2+Math.random()*3,c:color})
    }
  },
  spawnCrit(x,y){this.spawn(x,y,15,P.yl,5,25);this.spawn(x,y,8,P.wh,3,20)},
  spawnMiss(x,y){this.spawn(x,y,5,P.gy,2,15)},
  spawnHeal(x,y){this.spawn(x,y,10,P.gn,2,30)},
  spawnDeath(x,y){this.spawn(x,y,30,P.rd,6,40)},
  spawnSoulChange(x,y,color){this.spawn(x,y,12,color,3,25)},
  update(){for(let i=this.p.length-1;i>=0;i--){const p=this.p[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.l--;if(p.l<=0)this.p.splice(i,1)}},
  draw(){for(const p of this.p){cx.globalAlpha=p.l/p.ml;cx.fillStyle=p.c;cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}cx.globalAlpha=1}
};

// ════════ CRITICAL BAR SYSTEM ════════
const CritBar={
  active:false,
  pos:0,
  speed:0.018,
  dir:1,
  // Zona de sucesso
  zone:0.42,
  zoneW:0.12,
  // Super crit (zona menor)
  superZone:0.46,
  superW:0.04,
  result:null, // null, "miss", "hit", "crit", "super"
  resultTimer:0,
  damage:0,
  shakeTimer:0,
  shakeIntensity:0,

  start(bossLv=1){
    this.active=true;
    this.pos=0;
    this.dir=1;
    this.result=null;
    this.resultTimer=0;
    this.damage=0;
    // Velocidade aumenta por level do boss
    this.speed=0.016 + bossLv*0.004;
    // Zona diminui por level
    this.zoneW=Math.max(0.06, 0.14 - bossLv*0.02);
    this.superW=Math.max(0.02, 0.05 - bossLv*0.008);
    this.zone=0.42 + (Math.random()-0.5)*0.15;
    this.superZone=this.zone + (this.zoneW-this.superW)/2;
  },

  update(){
    if(!this.active)return;
    if(this.result){
      this.resultTimer--;
      if(this.resultTimer<=0){this.active=false;this.result=null}
      return;
    }
    this.pos+=this.speed*this.dir;
    if(this.pos>=1||this.pos<=0)this.dir*=-1;
    // Shake
    if(this.shakeTimer>0)this.shakeTimer--;
  },

  confirm(){
    if(!this.active||this.result)return 0;
    const p=this.pos;
    const baseDmg=5+SV.d.lv*2;

    // Super critical (menor zona)
    if(p>=this.superZone&&p<=this.superZone+this.superW){
      this.result="super";
      this.damage=Math.floor(baseDmg*3);
      this.shakeTimer=15;this.shakeIntensity=8;
      AU.crit();AU.crit();
      FX.spawnCrit(480,380);
    }
    // Critical (zona verde)
    else if(p>=this.zone&&p<=this.zone+this.zoneW){
      this.result="crit";
      this.damage=Math.floor(baseDmg*2);
      this.shakeTimer=10;this.shakeIntensity=5;
      AU.crit();
      FX.spawnCrit(480,380);
    }
    // Hit normal (acertou mas fora da zona)
    else if(p>=this.zone-0.15&&p<=this.zone+this.zoneW+0.15){
      this.result="hit";
      this.damage=baseDmg;
      AU.hit();
      FX.spawnMiss(480,380);
    }
    // Miss
    else{
      this.result="miss";
      this.damage=Math.floor(baseDmg*0.3);
      AU.miss();
    }

    this.resultTimer=45;
    return this.damage;
  },

  draw(){
    if(!this.active)return;

    const bx=280,by=380,bw=400,bh=24;

    // Shake offset
    let sx=0,sy=0;
    if(this.shakeTimer>0){
      sx=(Math.random()-.5)*this.shakeIntensity;
      sy=(Math.random()-.5)*this.shakeIntensity;
    }

    cx.save();
    cx.translate(sx,sy);

    // Barra de fundo
    box(bx,by,bw,bh,"#222",P.wh,2);

    // Zona de hit (amarelo)
    const hitStart=this.zone-0.15;
    const hitEnd=this.zone+this.zoneW+0.15;
    cx.fillStyle="rgba(255,200,50,.15)";
    cx.fillRect(bx+bw*hitStart,by+2,bw*(hitEnd-hitStart),bh-4);

    // Zona de crit (verde)
    cx.fillStyle=P.gn;
    cx.fillRect(bx+bw*this.zone,by+2,bw*this.zoneW,bh-4);

    // Zona super crit (amarelo brilhante)
    cx.fillStyle=P.yl;
    cx.fillRect(bx+bw*this.superZone,by+4,bw*this.superW,bh-8);

    // Cursor
    if(!this.result){
      cx.fillStyle=P.wh;
      cx.fillRect(bx+bw*this.pos-2,by-4,4,bh+8);
      // Sombra do cursor
      cx.fillStyle="rgba(255,255,255,.3)";
      cx.fillRect(bx+bw*this.pos-1,by-8,2,bh+16);
    }

    // Labels
    cx.font="10px monospace";cx.textAlign="center";
    cx.fillStyle=P.gy;
    cx.fillText("MISS",bx+bw*0.1,by-6);
    cx.fillStyle=P.gn;
    cx.fillText("CRIT",bx+bw*(this.zone+this.zoneW/2),by-6);
    cx.fillStyle=P.gy;
    cx.fillText("MISS",bx+bw*0.9,by-6);

    // Resultado
    if(this.result){
      cx.font="bold 24px monospace";cx.textAlign="center";
      if(this.result==="super"){
        cx.fillStyle=P.yl;
        const pulse=1+Math.sin(frame/3)*0.2;
        cx.font=`bold ${Math.floor(28*pulse)}px monospace`;
        cx.fillText(`★ SUPER CRIT! ${this.damage} DMG ★`,W/2,by-20)
      }else if(this.result==="crit"){
        cx.fillStyle=P.gn;
        cx.fillText(`CRITICAL! ${this.damage} DMG`,W/2,by-20)
      }else if(this.result==="hit"){
        cx.fillStyle=P.wh;
        cx.fillText(`${this.damage} DMG`,W/2,by-20)
      }else{
        cx.fillStyle=P.rd;
        cx.fillText(`MISS... ${this.damage} DMG`,W/2,by-20)
      }
    }

    cx.restore();
    cx.textAlign="left";

    // Instrução
    if(!this.result){
      cx.fillStyle=P.yl;cx.font="13px monospace";cx.textAlign="center";
      const blink=Math.sin(frame/8)>0;
      if(blink) cx.fillText("[Z] ATACAR!",W/2,by+bh+20);
      cx.textAlign="left"
    }
  }
};

// ════════ SOUL MODE SYSTEM ════════
const SoulMode={
  current:"red", // red, blue, green, yellow, purple
  colors:{red:P.soulRed,blue:P.soulBlue,green:P.soulGreen,yellow:P.soulYellow,purple:P.soulPurple},
  names:{red:"VERMELHA",blue:"AZUL",green:"VERDE",yellow:"AMARELA",purple:"ROXA"},
  descriptions:{
    red:"Livre para mover",
    blue:"Gravidade ativa",
    green:"Escudo frontal",
    yellow:"Pode atirar",
    purple:"Trilho fixo"
  },
  changeTimer:0,

  change(mode){
    if(this.current===mode)return;
    this.current=mode;
    this.changeTimer=60;
    AU.soulChange();
    FX.spawnSoulChange(SL.x,SL.y,this.colors[mode]);
    DL.quick(`Alma ${this.names[mode]}! ${this.descriptions[mode]}`)
  },

  getColor(){return this.colors[this.current]},

  draw(){
    if(this.changeTimer>0){
      this.changeTimer--;
      cx.fillStyle=this.getColor();
      cx.globalAlpha=this.changeTimer/60*0.3;
      cx.beginPath();cx.arc(SL.x,SL.y,30+this.changeTimer/2,0,Math.PI*2);cx.fill();
      cx.globalAlpha=1
    }
  }
};

// ════════ SOUL ════════
const SL={
  x:480,y:235,r:7,speed:2.8,
  // Blue mode
  vy:0,gravity:0.3,jumpForce:-6,grounded:false,
  // Green mode
  shieldAngle:0,shieldActive:false,
  // Yellow mode
  bullets:[],shootCooldown:0,
  // Purple mode
  railX:480,railDir:0,

  reset(){
    this.x=BT.bx+BT.bw/2;this.y=BT.by+BT.bh/2;
    this.vy=0;this.grounded=false;this.shieldAngle=0;
    this.bullets=[];this.shootCooldown=0;
    SoulMode.current="red"
  },

  update(){
    const mode=SoulMode.current;

    if(mode==="red"){
      // Livre para mover em qualquer direção
      if(K.l)this.x-=this.speed;
      if(K.r)this.x+=this.speed;
      if(K.u)this.y-=this.speed;
      if(K.d)this.y+=this.speed;
    }
    else if(mode==="blue"){
      // Gravidade + pulo
      if(K.l)this.x-=this.speed;
      if(K.r)this.x+=this.speed;
      this.vy+=this.gravity;
      this.y+=this.vy;
      // Chão da battle box
      if(this.y>=BT.by+BT.bh-this.r){
        this.y=BT.by+BT.bh-this.r;
        this.vy=0;this.grounded=true;
      }else{this.grounded=false}
      if(K.u&&this.grounded){this.vy=this.jumpForce;this.grounded=false;AU.sel()}
    }
    else if(mode==="green"){
      // Escudo que rotaciona, mas não se move
      if(K.l)this.shieldAngle-=0.08;
      if(K.r)this.shieldAngle+=0.08;
      if(K.u)this.shieldAngle-=0.08;
      if(K.d)this.shieldAngle+=0.08;
    }
    else if(mode==="yellow"){
      // Move + atira
      if(K.l)this.x-=this.speed;
      if(K.r)this.x+=this.speed;
      if(K.u)this.y-=this.speed;
      if(K.d)this.y+=this.speed;
      // Tiro
      if(this.shootCooldown>0)this.shootCooldown--;
      if(K.z&&this.shootCooldown<=0){
        this.bullets.push({x:this.x,y:this.y-10,vy:-5,r:3});
        this.shootCooldown=15;AU.sel()
      }
      // Update bullets
      for(let i=this.bullets.length-1;i>=0;i--){
        this.bullets[i].y+=this.bullets[i].vy;
        if(this.bullets[i].y<BT.by)this.bullets.splice(i,1)
      }
    }
    else if(mode==="purple"){
      // Preso em trilho vertical
      if(K.u)this.y-=this.speed;
      if(K.d)this.y+=this.speed;
      // x fixo
      this.x=this.railX;
    }

    // Clamp dentro da battle box
    this.x=clamp(this.x,BT.bx+this.r,BT.bx+BT.bw-this.r);
    this.y=clamp(this.y,BT.by+this.r,BT.by+BT.bh-this.r);
  },

  checkBulletCollision(bullet){
    if(SoulMode.current==="green"){
      // Shield blocks bullets in front
      const dx=bullet.x-this.x;
      const dy=bullet.y-this.y;
      const angle=Math.atan2(dy,dx);
      const diff=Math.abs(angle-this.shieldAngle);
      if(diff<0.8&&Math.hypot(dx,dy)<25){
        return "blocked"
      }
    }
    if(Math.hypot(SL.x-bullet.x,SL.y-bullet.y)<SL.r+bullet.r){
      return "hit"
    }
    return "none"
  },

  draw(){
    const mode=SoulMode.current;
    const color=SoulMode.getColor();
    const p=1+Math.sin(frame/7)*.12;

    // Glow
    cx.fillStyle=color.replace(")",",0.15)").replace("rgb","rgba");
    cx.beginPath();cx.arc(this.x,this.y,this.r*2*p,0,Math.PI*2);cx.fill();

    // Heart
    cx.fillStyle=color;
    cx.save();cx.translate(this.x,this.y);cx.rotate(Math.PI/4);
    cx.fillRect(-this.r/2,-this.r/2,this.r,this.r);cx.restore();

    // Shine
    cx.fillStyle="rgba(255,255,255,.35)";
    cx.fillRect(this.x-this.r/3,this.y-this.r/2.5,this.r/3,this.r/3);

    // Mode specific visuals
    if(mode==="green"){
      // Shield arc
      cx.strokeStyle=P.soulGreen;cx.lineWidth=4;
      cx.beginPath();
      cx.arc(this.x,this.y,20,this.shieldAngle-0.6,this.shieldAngle+0.6);
      cx.stroke();
      cx.lineWidth=2
    }
    if(mode==="yellow"){
      // Yellow bullets
      cx.fillStyle=P.soulYellow;
      for(const b of this.bullets){
        cx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)
      }
    }
    if(mode==="purple"){
      // Rail line
      cx.strokeStyle="rgba(170,34,255,.3)";cx.lineWidth=3;
      cx.beginPath();cx.moveTo(this.railX,BT.by);cx.lineTo(this.railX,BT.by+BT.bh);cx.stroke();
      cx.lineWidth=2
    }
    if(mode==="blue"){
      // Gravity indicator
      cx.fillStyle="rgba(34,68,255,.2)";
      cx.fillRect(BT.bx,BT.by+BT.bh-4,BT.bw,4)
    }

    SoulMode.draw()
  }
};

// ════════ MAP ════════
const TILE=32,RW=30,RH=17;

function createRoom(phase){
  const room={tiles:[],npcs:[],saves:[],door:null,items:[]};
  for(let y=0;y<RH;y++){room.tiles[y]=[];for(let x=0;x<RW;x++){room.tiles[y][x]=(y===0||y===RH-1||x===0||x===RW-1)?1:0}}
  if(phase===0){
    for(let y=3;y<7;y++){[5,10,15,20,25].forEach(x=>{room.tiles[y][x]=1})}
    for(let x=12;x<18;x++)room.tiles[10][x]=2;
    room.npcs.push({type:"lucas",x:8,y:8,talked:false});
    room.saves.push({x:4,y:12,preBoss:false,used:false});
    room.saves.push({x:22,y:8,preBoss:true,used:false});
    room.door={x:28,y:8};room.items.push({x:14,y:5,type:"heal",taken:false})
  }else if(phase===1){
    [[4,3],[7,5],[12,4],[18,6],[23,3],[8,10],[16,11],[24,10]].forEach(([x,y])=>{room.tiles[y][x]=1});
    room.npcs.push({type:"lucas",x:13,y:7,talked:false});
    room.saves.push({x:3,y:14,preBoss:false,used:false});
    room.saves.push({x:24,y:6,preBoss:true,used:false});
    room.door={x:28,y:8};room.items.push({x:20,y:12,type:"heal",taken:false})
  }else if(phase===2){
    for(let x=8;x<22;x++){room.tiles[5][x]=1;room.tiles[11][x]=1}
    room.tiles[5][14]=0;room.tiles[5][15]=0;room.tiles[11][14]=0;room.tiles[11][15]=0;
    room.npcs.push({type:"lucas",x:14,y:8,talked:false});
    room.saves.push({x:3,y:8,preBoss:false,used:false});
    room.saves.push({x:25,y:8,preBoss:true,used:false});
    room.door={x:28,y:8}
  }else{
    for(let y=3;y<6;y++)for(let x=3;x<8;x++)room.tiles[y][x]=2;
    for(let y=3;y<6;y++)for(let x=22;x<27;x++)room.tiles[y][x]=2;
    for(let y=10;y<14;y++){room.tiles[y][10]=1;room.tiles[y][19]=1}
    room.npcs.push({type:"lucas",x:14,y:4,talked:false});
    room.saves.push({x:3,y:14,preBoss:false,used:false});
    room.saves.push({x:14,y:12,preBoss:true,used:false});
    room.door={x:14,y:2}
  }
  return room
}

    for(const n of room.npcs){const nx=n.x*TILE-8,ny=n.y*TILE-16;px(LUCAS_NPC,nx,ny,3,LUCAS_P);if(!n.talked&&Math.abs(Math.floor((PL.x+12)/TILE)-n.x)<=2&&Math.abs(Math.floor((PL.y+12)/TILE)-n.y)<=2){cx.fillStyle=P.cy;cx.font="11px monospace";cx.textAlign="center";cx.fillText("[A] Falar",nx+18,ny-6);cx.textAlign="left"}}

// ════════ BATTLE ════════
const BT={
  on:false,boss:null,
  mode:"player", // player, crit, enemy, anim
  bullets:[],turnT:0,turnDur:200,sel:0,
  actions:["ATACAR","FALAR","AGIR","MERCY"],
  dmgThisBoss:false,
  bx:250,by:100,bw:460,bh:270,
  // Damage numbers
  dmgNums:[],

  start(phase){
    state="battle";prevState="battle";
    this.on=true;this.bullets=[];this.mode="player";this.sel=0;this.dmgThisBoss=false;this.dmgNums=[];
    if(phase===0)this.boss=new Boss1();
    else if(phase===1)this.boss=new Boss2();
    else if(phase===2)this.boss=new Boss3();
    else this.boss=new BossF();
    SL.reset();
    AU.playM(phase===3?"final":"battle")
  },

  end(){this.on=false;state="world";this.bullets=[];AU.stopM();SV.save()},

  addDmgNum(x,y,dmg,type){
    this.dmgNums.push({x,y,dmg,type,t:60,vy:-2})
  },

  enemyTurn(){
    this.mode="enemy";this.turnT=this.turnDur;
    SL.x=this.bx+this.bw/2;SL.y=this.by+this.bh/2
  },

  update(){
    if(!this.on||state!=="battle")return;

    // Update damage numbers
    for(let i=this.dmgNums.length-1;i>=0;i--){
      this.dmgNums[i].y+=this.dmgNums[i].vy;
      this.dmgNums[i].t--;
      if(this.dmgNums[i].t<=0)this.dmgNums.splice(i,1)
    }

    if(this.mode==="crit"){
      CritBar.update();
      return
    }

    if(this.mode==="enemy"){
      this.turnT--;
      this.boss.attack(this.bullets);
      SL.update();

      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];
        b.x+=b.vx;b.y+=b.vy;
        if(b.accel){b.vx+=b.ax||0;b.vy+=b.ay||0}
        if(b.wave){b.x+=Math.sin(b.wt)*b.wamp;b.wt+=b.wspd}
        if(b.homing){
          const dx=SL.x-b.x,dy=SL.y-b.y;
          const d=Math.hypot(dx,dy)||1;
          b.vx+=(dx/d)*0.05;b.vy+=(dy/d)*0.05
        }
        b.t--;

        const result=SL.checkBulletCollision(b);
        if(result==="blocked"){
          FX.spawn(b.x,b.y,5,P.soulGreen,2,15);
          this.bullets.splice(i,1);continue
        }
        if(result==="hit"){
          PL.hp=Math.max(0,PL.hp-1);AU.dmg();this.dmgThisBoss=true;
          FX.spawn(SL.x,SL.y,6,P.rd,2,15);
          this.bullets.splice(i,1);continue
        }

        // Soul yellow bullets hitting enemy bullets
        if(SoulMode.current==="yellow"){
          for(let j=SL.bullets.length-1;j>=0;j--){
            if(Math.hypot(SL.bullets[j].x-b.x,SL.bullets[j].y-b.y)<b.r+SL.bullets[j].r){
              FX.spawn(b.x,b.y,4,P.soulYellow,2,10);
              this.bullets.splice(i,1);SL.bullets.splice(j,1);break
            }
          }
        }

        if(b.t<=0||b.x<this.bx-30||b.x>this.bx+this.bw+30||b.y<this.by-30||b.y>this.by+this.bh+30)
          this.bullets.splice(i,1)
      }

      if(PL.hp<=0){this.onLose();return}
      if(this.turnT<=0){this.mode="player";this.bullets=[]}
    }
  },

  onLose(){
    AU.die();SV.d.deaths++;FX.spawnDeath(SL.x,SL.y);
    this.on=false;
    showStory("Você caiu...",["Mas sua determinação permanece.","O save pré-boss foi carregado."],
      ()=>{PL.hp=PL.maxHp;WR.init(WR.phase)})
  },

  doAction(){
    const a=this.actions[this.sel];AU.sel();
    if(a==="ATACAR"){
      // Inicia barra de crítico
      this.mode="crit";
      CritBar.start(this.boss.bossLv||1)
    }
    else if(a==="FALAR"){this.boss.onTalk();SV.d.talks++;if(!this.boss.resolved)this.enemyTurn()}
    else if(a==="AGIR"){this.boss.onAct();SV.d.acts++;if(!this.boss.resolved)this.enemyTurn()}
    else{this.boss.onMercy();if(!this.boss.resolved)this.enemyTurn()}
  },

  confirmCrit(){
    const dmg=CritBar.confirm();
    if(dmg>0){
      this.boss.hp=Math.max(0,this.boss.hp-dmg);
      this.addDmgNum(W/2,120,dmg,CritBar.result);
      if(this.boss.hp<=0){
        this.boss.onDeath();
      }else{
        // Wait for result animation then enemy turn
        setTimeout(()=>{
          if(this.on&&!this.boss.resolved){this.enemyTurn()}
        },800)
      }
    }
  },

  draw(){
    cx.fillStyle="#000";cx.fillRect(0,0,W,H);

    // Boss shake
    let sx=0,sy=0;
    if(CritBar.shakeTimer>0){sx=(Math.random()-.5)*CritBar.shakeIntensity;sy=(Math.random()-.5)*CritBar.shakeIntensity}
    cx.save();cx.translate(sx,sy);
    this.boss.drawBoss(W/2-50,30);
    cx.restore();

    cText(this.boss.nm,26,20,P.wh);

    // Boss HP
    box(300,this.by-24,360,16,"#111",P.wh,1);
    const hpp=this.boss.hp/this.boss.mhp;
    cx.fillStyle=hpp>.5?P.gn:hpp>.25?P.or:P.rd;
    cx.fillRect(302,this.by-22,356*hpp,12);
    cx.fillStyle=P.wh;cx.font="10px monospace";cx.textAlign="center";
    cx.fillText(`${this.boss.hp}/${this.boss.mhp}`,480,this.by-12);cx.textAlign="left";

    // Trust bar
    if(this.boss.trust!==undefined){
      box(300,this.by-6,360,8,"#111",P.yl,1);
      cx.fillStyle=P.yl;cx.fillRect(302,this.by-4,356*(this.boss.trust/this.boss.trustReq),4)
    }

    // Battle box
    box(this.bx,this.by,this.bw,this.bh,"#000",P.wh,3);

    // Bullets
    for(const b of this.bullets){
      cx.fillStyle=b.c||P.rd;
      if(b.shape==="rect"){cx.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)}
      else if(b.shape==="diamond"){cx.save();cx.translate(b.x,b.y);cx.rotate(Math.PI/4);cx.fillRect(-b.r/2,-b.r/2,b.r,b.r);cx.restore()}
      else{cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill()}
    }

    // Soul
    if(this.mode==="enemy") SL.draw();

    // Critical bar
    if(this.mode==="crit") CritBar.draw();

    // Damage numbers
    for(const d of this.dmgNums){
      cx.globalAlpha=d.t/60;

    cx.fillStyle=P.wh;cx.font="14px monospace";
    cx.fillText(`HP ${PL.hp}/${PL.maxHp}`,hpx+15,hpy+5);

  }
};

function drawSoulMini(x,y){

// ════════ ENDINGS ════════
function getEnding(){
  const d=SV.d;const allM=d.mercies>=4&&d.kills===0;const allK=d.kills>=4&&d.mercies===0;
  const noAtk=!d.attackedFinal;const talkedAll=d.talks>=15;
  if(allM&&noAtk&&talkedAll)return"true_pacifist";if(allM&&noAtk)return"pacifist";
  if(allM)return"good";if(allK)return"genocide";if(d.kills>=3)return"bad";
  if(d.mercies>d.kills)return"neutral_good";return"neutral"
}

    neutral:{t:"FINAL NEUTRO",m:"sad",l:["Suas escolhas tiveram peso.","O futuro é incerto.","","FIM NEUTRO"]},
    bad:{t:"FINAL RUIM",m:"sad",l:["Você escolheu violência na maioria das vezes.","Os problemas foram silenciados, não resolvidos.","","FIM RUIM"]},

document.addEventListener("keydown",e=>{
  AU.res();
  if(e.key==="ArrowLeft"||e.key==="a")K.l=1;
  if(e.key==="ArrowRight"||e.key==="d")K.r=1;
  if(e.key==="ArrowUp"||e.key==="w")K.u=1;
  if(e.key==="ArrowDown"||e.key==="s")K.d=1;
  if(e.key==="e"||e.key==="Enter"){K.a=1;
    if(state==="dialogue"){e.preventDefault();DL.next()}
    else if(state==="menu"){e.preventDefault();MN.confirm()}
    else if(state==="story"){e.preventDefault();nextStory()}
    else if(state==="credits"){e.preventDefault();state="menu";MN.init()}
    else if(state==="battle"&&BT.mode==="player"){e.preventDefault();BT.doAction()}
  }
  if(e.key==="z"||e.key==="Z"){K.z=1;
    if(state==="battle"&&BT.mode==="crit"){e.preventDefault();BT.confirmCrit()}
  }
  if(state==="menu"){if(e.key==="ArrowUp"){MN.sel=(MN.sel+MN.opts.length-1)%MN.opts.length;AU.sel()}if(e.key==="ArrowDown"){MN.sel=(MN.sel+1)%MN.opts.length;AU.sel()}}
  if(state==="battle"&&BT.mode==="player"){if(e.key==="ArrowLeft"){BT.sel=(BT.sel+3)%4;AU.sel()}if(e.key==="ArrowRight"){BT.sel=(BT.sel+1)%4;AU.sel()}}
});

  if(e.key==="ArrowUp"||e.key==="w")K.u=0;if(e.key==="ArrowDown"||e.key==="s")K.d=0;
  if(e.key==="e"||e.key==="Enter")K.a=0;if(e.key==="z"||e.key==="Z")K.z=0
});

  if(state==="dialogue")DL.next();else if(state==="story")nextStory();else if(state==="menu")MN.confirm();else if(state==="credits"){state="menu";MN.init()}
  else if(state==="battle"&&BT.mode==="player")BT.doAction()},{passive:false});
document.getElementById("ma").addEventListener("touchend",e=>{e.preventDefault();K.a=0},{passive:false});
document.getElementById("mz").addEventListener("touchstart",e=>{e.preventDefault();AU.res();K.z=1;
  if(state==="battle"&&BT.mode==="crit")BT.confirmCrit()},{passive:false});
document.getElementById("mz").addEventListener("touchend",e=>{e.preventDefault();K.z=0},{passive:false});

// ════════ MAIN LOOP ════════
function tick(){
  frame++;updateFade();DL.update();FX.update();
  if(state==="menu")MN.update();
  else if(state==="world")WR.update();
  else if(state==="battle")BT.update();
  else if(state==="story")updateStory();

  cx.clearRect(0,0,W,H);
  if(state==="boot"){cx.fillStyle="#000";cx.fillRect(0,0,W,H)}
  else if(state==="menu")MN.draw();
  else if(state==="world"||state==="dialogue")WR.draw();
  else if(state==="battle")BT.draw();
  else if(state==="story")drawStory();
  else if(state==="credits")drawCredits();
  DL.draw();FX.draw();drawFade();
  requestAnimationFrame(tick)
}

state="boot";fadeA=1;setTimeout(()=>{state="menu";MN.init();fadeD=-1},500);
tick();
</script>
