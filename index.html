const AU={
  x:null,
  init(){try{this.x=new(window.AudioContext||window.webkitAudioContext)}catch(e){}},
  res(){if(this.x&&this.x.state==="suspended")this.x.resume()},
  t(f=440,d=.08,tp="square",v=.02){
    if(!this.x)return;
    const o=this.x.createOscillator(),g=this.x.createGain();
    o.type=tp;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.0001,this.x.currentTime+d);
    o.connect(g);g.connect(this.x.destination);o.start();o.stop(this.x.currentTime+d)
  },
  sel(){this.t(700,.04,"square",.025)},
  hit(){this.t(120,.16,"sawtooth",.04)},
  txt(){this.t(480+Math.random()*140,.025,"square",.012)},

    this.stopM();this.mt=track;

    };
    const p=patterns[track];if(!p)return;
    let i=0;
    this.mi=setInterval(()=>{this.t(p.n[i%p.n.length],p.t/1000*.8,p.tp,p.v);i++},p.t)
  },
  stopM(){if(this.mi){clearInterval(this.mi);this.mi=null;this.mt=""}}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function cText(t,y,s=16,c="#fff"){cx.fillStyle=c;cx.font=s+"px monospace";cx.textAlign="center";cx.fillText(t,W/2,y);cx.textAlign="left"}
function box(x,y,w,h,f="#000",s="#fff",lw=2){cx.fillStyle=f;cx.fillRect(x,y,w,h);cx.strokeStyle=s;cx.lineWidth=lw;cx.strokeRect(x,y,w,h)}
function px(map,ox,oy,sc,pal,flip=false){
  for(let r=0;r<map.length;r++)
    for(let c=0;c<map[r].length;c++){
      const ch=map[r][c];if(ch==="."||!pal[ch])continue;
      cx.fillStyle=pal[ch];
      const dx=flip?(map[r].length-1-c):c;
      cx.fillRect(Math.round(ox+dx*sc),Math.round(oy+r*sc),sc,sc)
    }
}
function wrapT(t,x,y,mw,lh){
  const w=t.split(" ");let l="";
  for(let i=0;i<w.length;i++){
    const test=l+w[i]+" ";
    if(cx.measureText(test).width>mw&&i>0){cx.fillText(l,x,y);l=w[i]+" ";y+=lh}
    else l=test
  }
  cx.fillText(l,x,y)
}
function fade(dir,speed=0.02){fadeDir=dir;if(dir>0)fadeAlpha=0;else fadeAlpha=1}
function updateFade(){
  if(fadeDir>0){fadeAlpha=Math.min(1,fadeAlpha+0.025)}
  else if(fadeDir<0){fadeAlpha=Math.max(0,fadeAlpha-0.025)}
}
function drawFade(){if(fadeAlpha>0.01){cx.fillStyle=`rgba(0,0,0,${fadeAlpha})`;cx.fillRect(0,0,W,H)}}

const DL={
  on:false,sp:"",ls:[],i:0,shown:"",ci:0,
  qm:"",qt:0,cb:null,
  start(sp,ls,cb=null){this.on=true;this.sp=sp;this.ls=ls;this.i=0;this.shown="";this.ci=0;this.cb=cb;state="dialogue"},
  quick(m){this.qm=m;this.qt=180},
  next(){
    if(!this.on)return;
    if(this.ci<this.ls[this.i].length){this.shown=this.ls[this.i];this.ci=this.ls[this.i].length;return}

    if(this.i>=this.ls.length){this.on=false;state=prevState||"world";if(this.cb)this.cb();return}
    this.shown="";this.ci=0

  update(){
    if(this.qt>0)this.qt--;
    if(!this.on)return;

    if(this.ci<c.length&&frame%2===0){this.shown+=c[this.ci];if(c[this.ci]!==" ")AU.txt();this.ci++}
  },
  draw(){
    if(this.qt>0){
      const a=Math.min(1,this.qt/20);

// ════════ ENDINGS TRACKER ════════
function getEnding(){
  const d=SV.d;
  const allMercy=d.mercies>=4&&d.kills===0;
  const allKill=d.kills>=4&&d.mercies===0;
  const mixed=!allMercy&&!allKill;
  const noAttackFinal=!d.attackedFinal;
  const talkedAll=d.talks>=15;

  if(allMercy&&noAttackFinal&&talkedAll) return "true_pacifist";
  if(allMercy&&noAttackFinal) return "pacifist";
  if(allMercy) return "good";
  if(allKill) return "genocide";
  if(d.kills>=3) return "bad";
  if(mixed&&d.mercies>d.kills) return "neutral_good";
  return "neutral";
}

// ════════ MAP SYSTEM ════════
// Rooms no estilo grid/tile
const TILE=32;
const ROOM_W=30; // tiles
const ROOM_H=17; // tiles

function createRoom(phase){
  const room={tiles:[],npcs:[],saves:[],door:null,items:[],triggers:[]};
  
  // Base: bordas são parede, interior é chão
  for(let y=0;y<ROOM_H;y++){
    room.tiles[y]=[];
    for(let x=0;x<ROOM_W;x++){
      if(y===0||y===ROOM_H-1||x===0||x===ROOM_W-1)
        room.tiles[y][x]=1; // parede
      else
        room.tiles[y][x]=0; // chão
    }
  }

  // Detalhes por fase
  if(phase===0){
    // Sala digital - pilares de tela
    for(let y=3;y<7;y++){room.tiles[y][5]=1;room.tiles[y][10]=1;room.tiles[y][15]=1;room.tiles[y][20]=1;room.tiles[y][25]=1}
    // Mesa
    for(let x=12;x<18;x++)room.tiles[10][x]=2;
    room.npcs.push({type:"lucas",x:8,y:8,talked:false});
    room.saves.push({x:4,y:12,preBoss:false,used:false});
    room.saves.push({x:22,y:8,preBoss:true,used:false});
    room.door={x:28,y:8};
    room.items.push({x:14,y:5,type:"heal",taken:false});
    room.triggers.push({x:2,y:8,id:"intro_"+phase,done:false});
  }
  else if(phase===1){
    // Sala caótica - blocos aleatórios
    [[4,3],[7,5],[12,4],[18,6],[23,3],[8,10],[16,11],[24,10]].forEach(([x,y])=>{room.tiles[y][x]=1});
    room.npcs.push({type:"lucas",x:13,y:7,talked:false});
    room.saves.push({x:3,y:14,preBoss:false,used:false});
    room.saves.push({x:24,y:6,preBoss:true,used:false});
    room.door={x:28,y:8};
    room.items.push({x:20,y:12,type:"heal",taken:false});
  }
  else if(phase===2){
    // Sala vazia - poucos obstáculos, muito espaço
    for(let x=8;x<22;x++){room.tiles[5][x]=1;room.tiles[11][x]=1}
    room.tiles[5][14]=0;room.tiles[5][15]=0; // passagem
    room.tiles[11][14]=0;room.tiles[11][15]=0;
    room.npcs.push({type:"lucas",x:14,y:8,talked:false});
    room.saves.push({x:3,y:8,preBoss:false,used:false});
    room.saves.push({x:25,y:8,preBoss:true,used:false});
    room.door={x:28,y:8};
  }
  else{
    // Lab final - grid tech
    for(let y=3;y<6;y++)for(let x=3;x<8;x++)room.tiles[y][x]=2;
    for(let y=3;y<6;y++)for(let x=22;x<27;x++)room.tiles[y][x]=2;
    for(let y=10;y<14;y++){room.tiles[y][10]=1;room.tiles[y][19]=1}
    room.npcs.push({type:"lucas",x:14,y:4,talked:false});
    room.saves.push({x:3,y:14,preBoss:false,used:false});
    room.saves.push({x:14,y:12,preBoss:true,used:false});
    room.door={x:14,y:2};
  }

  return room;
}

// ════════ WORLD ════════
let prevState="world";
const WR={
  phase:0,room:null,
  camX:0,camY:0,

  init(phase){
    this.phase=phase;
    this.room=createRoom(phase);
    state="world";prevState="world";
    PL.x=3*TILE;PL.y=8*TILE;PL.dir=1;
    PL.hp=SV.d.hp||PL.maxHp;
    const musics=["world1","world2","world3","worldF"];
    AU.playM(musics[Math.min(phase,3)]);
    DL.quick(["Fase 1: Vício Digital","Fase 2: Desinformação","Fase 3: Isolamento Social","Fase Final: Lucas"][phase]);
  },

  getTile(tx,ty){
    if(tx<0||tx>=ROOM_W||ty<0||ty>=ROOM_H)return 1;
    return this.room.tiles[ty][tx];
  },

  update(){
    if(state!=="world")return;
    PL.update();

    const ptx=Math.floor((PL.x+12)/TILE);
    const pty=Math.floor((PL.y+12)/TILE);

    // NPC interaction
    for(const n of this.room.npcs){
      if(!n.talked&&Math.abs(ptx-n.x)<=1&&Math.abs(pty-n.y)<=1&&K.a){
        K.a=0;n.talked=true;
        prevState="world";
        this.talkLucas();
      }
    }

    // Save
    for(const s of this.room.saves){
      if(!s.used&&ptx===s.x&&pty===s.y){
        s.used=true;
        if(s.preBoss){
          SV.d.hp=PL.maxHp;PL.hp=PL.maxHp;
          SV.d.preBoss=true;SV.save();
          AU.sv();DL.quick("💾 Save pré-boss! Vida restaurada!")
        }else{
          SV.d.hp=PL.hp;SV.save();AU.sv();DL.quick("💾 Progresso salvo.")
        }
      }
    }

    // Items
    for(const it of this.room.items||[]){
      if(!it.taken&&ptx===it.x&&pty===it.y){
        it.taken=true;
        if(it.type==="heal"){PL.hp=Math.min(PL.hp+5,PL.maxHp);DL.quick("❤️ +5 HP!")}
      }
    }

    // Door
    if(this.room.door&&ptx===this.room.door.x&&pty===this.room.door.y){
      BT.start(this.phase);
    }
  },

  talkLucas(){
    SV.d.lucas[this.phase]=true;
    SV.d.talks++;
    const d=[
      [
        "Você veio...",

      ],[

        "Eu já fui assim. Compartilhava tudo sem pensar.",

      ],[
        "...",
        "Esse é o que mais dói em mim.",
        "Porque eu causei isso. Em mim e nos outros.",

        "Que EU ainda importo mais que qualquer código."
      ]
    ];
    DL.start("Lucas",d[Math.min(this.phase,3)])
  },

  draw(){
    // Background
    const bgs=[P.bg1,P.bg2,P.bg3,P.bg4];
    cx.fillStyle=bgs[Math.min(this.phase,3)];cx.fillRect(0,0,W,H);

    const room=this.room;
    const ox=0,oy=0; // simple no-scroll for now

    // Tiles
    const wallColors=[["#1a2848","#243868"],["#3a1818","#4a2020"],["#181830","#202048"],["#0a200a","#103010"]];
    const floorColors=[["#0d1828","#101e30"],["#200808","#2a0e0e"],["#0c0c20","#101028"],["#051005","#081808"]];
    const wc=wallColors[Math.min(this.phase,3)];
    const fc=floorColors[Math.min(this.phase,3)];

    for(let y=0;y<ROOM_H;y++){
      for(let x=0;x<ROOM_W;x++){
        const t=room.tiles[y][x];
        const dx=ox+x*TILE,dy=oy+y*TILE;
        if(t===1){
          cx.fillStyle=wc[(x+y)%2];cx.fillRect(dx,dy,TILE,TILE);
          cx.fillStyle="rgba(255,255,255,.04)";cx.fillRect(dx,dy,TILE,2)
        }else if(t===2){
          cx.fillStyle="#1a3030";cx.fillRect(dx,dy,TILE,TILE);
          cx.strokeStyle="rgba(0,255,100,.15)";cx.strokeRect(dx+2,dy+2,TILE-4,TILE-4)
        }else{
          cx.fillStyle=fc[(x+y)%2];cx.fillRect(dx,dy,TILE,TILE)
        }
      }
    }

    // Phase-specific decorations
    if(this.phase===0){
      // Screen glows on pillars
      for(const px2 of [5,10,15,20,25]){
        cx.fillStyle="rgba(0,200,255,.12)";
        cx.fillRect(px2*TILE+4,4*TILE,TILE-8,2*TILE)
      }
    }
    if(this.phase===3){
      // Grid lines
      cx.strokeStyle="rgba(0,255,100,.06)";cx.lineWidth=1;
      for(let x=0;x<W;x+=TILE){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
      for(let y=0;y<H;y+=TILE){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    }

    // Save points
    for(const s of room.saves){
      const sx=ox+s.x*TILE+TILE/2,sy=ox+s.y*TILE+TILE/2;
      const pulse=1+Math.sin(frame/10)*.08;
      cx.save();cx.translate(sx,sy);cx.scale(pulse,pulse);
      if(s.used){cx.fillStyle="#555";cx.fillRect(-5,-12,10,14)}
      else{cx.fillStyle=s.preBoss?P.or:P.yl;cx.fillRect(-5,-12,10,14)}
      cx.restore();
      cx.fillStyle=P.wh;cx.font="9px monospace";cx.textAlign="center";
      cx.fillText(s.used?"✓":(s.preBoss?"★BOSS":"★"),sx,sy-16);cx.textAlign="left"
    }

    // Items
    for(const it of room.items||[]){
      if(it.taken)continue;
      cx.fillStyle=P.gn;
      cx.fillRect(ox+it.x*TILE+10,oy+it.y*TILE+10,12,12);
      cx.fillStyle=P.wh;cx.font="8px monospace";cx.textAlign="center";
      cx.fillText("HP",ox+it.x*TILE+16,oy+it.y*TILE+8);cx.textAlign="left"
    }

    // NPCs
    for(const n of room.npcs){
      const nx=ox+n.x*TILE-8,ny=oy+n.y*TILE-16;
      px(LUCAS_NPC,nx,ny,3,LUCAS_NPC_PAL);
      if(!n.talked&&Math.abs(Math.floor((PL.x+12)/TILE)-n.x)<=2&&Math.abs(Math.floor((PL.y+12)/TILE)-n.y)<=2){
        cx.fillStyle=P.cy;cx.font="11px monospace";cx.textAlign="center";
        cx.fillText("[A] Falar",nx+18,ny-6);cx.textAlign="left"
      }
    }

    // Door
    if(room.door){
      const dx=ox+room.door.x*TILE,dy=oy+room.door.y*TILE;
      cx.fillStyle="#1a0000";cx.fillRect(dx,dy,TILE,TILE);
      cx.fillStyle=P.rd;cx.fillRect(dx+4,dy+8,24,4);
      const blink=Math.sin(frame/15)>.3;
      if(blink){cx.fillStyle=P.wh;cx.font="9px monospace";cx.textAlign="center";
      cx.fillText("BOSS",dx+16,dy-4);cx.textAlign="left"}
    }

    // Player
    PL.draw(ox,oy);

    // HUD
    this.drawHUD()
  },

  drawHUD(){
    box(8,8,180,50,"rgba(0,0,0,.7)",P.wh,1);
    // HP
    cx.fillStyle=P.wh;cx.font="12px monospace";cx.fillText("HP",14,28);
    cx.fillStyle="#333";cx.fillRect(34,17,120,14);
    cx.fillStyle=PL.hp/PL.maxHp>.5?P.gn:PL.hp/PL.maxHp>.25?P.or:P.rd;
    cx.fillRect(36,19,(PL.hp/PL.maxHp)*116,10);
    cx.fillStyle=P.wh;cx.font="11px monospace";cx.fillText(`${PL.hp}/${PL.maxHp}`,160,28);
    // LV
    cx.fillText(`LV ${SV.d.lv}`,14,48);
    // Phase
    cx.fillStyle="rgba(255,255,255,.3)";cx.font="10px monospace";
    const names=["Vício Digital","Desinformação","Isolamento Social","Lucas"];
    cx.textAlign="right";cx.fillText(names[Math.min(this.phase,3)],W-10,20);cx.textAlign="left";
    // Controls
    cx.fillStyle="rgba(255,255,255,.2)";cx.font="9px monospace";
    cx.fillText("Setas: mover | A: interagir",10,H-8)
  }
};

// ════════ PLAYER WORLD ════════
const PL={
  x:3*TILE,y:8*TILE,
  hp:20,maxHp:20,
  dir:1, // 0=up 1=right 2=down 3=left
  moving:false,
  moveTimer:0,
  speed:2.5,

  update(){
    if(state!=="world")return;
    let dx=0,dy=0;
    if(K.l){dx=-this.speed;this.dir=3}
    if(K.r){dx=this.speed;this.dir=1}
    if(K.u){dy=-this.speed;this.dir=0}
    if(K.d){dy=this.speed;this.dir=2}
    this.moving=dx!==0||dy!==0;
    if(this.moving)this.moveTimer+=0.12;

    // Collision check
    const nx=this.x+dx,ny=this.y+dy;
    const tx1=Math.floor(nx/TILE),ty1=Math.floor(ny/TILE);
    const tx2=Math.floor((nx+20)/TILE),ty2=Math.floor((ny+24)/TILE);

    let blocked=false;
    for(let cy2=ty1;cy2<=ty2;cy2++)
      for(let cx2=tx1;cx2<=tx2;cx2++)
        if(WR.getTile(cx2,cy2)===1) blocked=true;

    if(!blocked){this.x=nx;this.y=ny}
    this.x=clamp(this.x,TILE,ROOM_W*TILE-TILE-24);
    this.y=clamp(this.y,TILE,ROOM_H*TILE-TILE-28)
  },

  draw(ox,oy){
    const sprite=this.moving?(Math.floor(this.moveTimer)%2===0?SP_W1:SP_W2):SP_IDLE;
    const flip=this.dir===3;
    px(sprite,ox+this.x-8,oy+this.y-24,3,SP_PAL,flip)
  }
};

// ════════ BATTLE ════════
const BT={
  on:false,boss:null,
  mode:"player", // player, enemy, anim
  bullets:[],
  turnT:0,turnDur:200,
  sel:0,
  actions:["ATACAR","FALAR","AGIR","MERCY"],
  // attack animation
  atkAnim:0,
  dmgThisBoss:false,

  bx:250,by:100,bw:460,bh:270,

  start(phase){
    state="battle";prevState="battle";
    this.on=true;this.bullets=[];this.mode="player";
    this.sel=0;this.dmgThisBoss=false;
    if(phase===0) this.boss=new Boss1();
    else if(phase===1) this.boss=new Boss2();
    else if(phase===2) this.boss=new Boss3();
    else this.boss=new BossF();
    SL.x=this.bx+this.bw/2;SL.y=this.by+this.bh/2;
    const m=phase===3?"final":"battle";
    AU.playM(m)
  },

  end(){
    this.on=false;state="world";this.bullets=[];
    AU.stopM();SV.save()
  },

  enemyTurn(){this.mode="enemy";this.turnT=this.turnDur},

  update(){
    if(!this.on||state!=="battle")return;

    if(this.mode==="enemy"){
      this.turnT--;
      this.boss.attack(this.bullets);
      SL.update();

      for(let i=this.bullets.length-1;i>=0;i--){
        const b=this.bullets[i];
        b.x+=b.vx;b.y+=b.vy;b.t--;
        if(Math.hypot(SL.x-b.x,SL.y-b.y)<SL.r+b.r){
          PL.hp=Math.max(0,PL.hp-1);
          AU.dmg();this.dmgThisBoss=true;
          this.bullets.splice(i,1);continue
        }
        if(b.t<=0||b.x<this.bx-20||b.x>this.bx+this.bw+20||b.y<this.by-20||b.y>this.by+this.bh+20)
          this.bullets.splice(i,1)
      }

      if(PL.hp<=0){this.onLose();return}
      if(this.turnT<=0){this.mode="player";this.bullets=[]}
    }
  },

  onLose(){
    AU.die();SV.d.deaths++;
    this.on=false;
    showStory("Você caiu...",
      ["Mas sua determinação permanece.","O save pré-boss foi carregado."],
      ()=>{PL.hp=PL.maxHp;WR.init(WR.phase)})
  },

  doAction(){
    const a=this.actions[this.sel];
    AU.sel();
    if(a==="ATACAR"){this.boss.onAttack();SV.d.kills;if(!this.boss.resolved)this.enemyTurn()}
    else if(a==="FALAR"){this.boss.onTalk();SV.d.talks++;if(!this.boss.resolved)this.enemyTurn()}
    else if(a==="AGIR"){this.boss.onAct();SV.d.acts++;if(!this.boss.resolved)this.enemyTurn()}
    else{this.boss.onMercy();if(!this.boss.resolved)this.enemyTurn()}
  },

  draw(){
    cx.fillStyle="#000";cx.fillRect(0,0,W,H);

    // Boss
    const bcx=W/2-40,bcy=24;
    this.boss.drawBoss(bcx,bcy);

    // Boss name
    cText(this.boss.nm,24,20,P.wh);

    // Boss HP
    box(300,this.by-20,360,14,"#111",P.wh,1);
    const hpp=this.boss.hp/this.boss.mhp;
    cx.fillStyle=hpp>.5?P.gn:hpp>.25?P.or:P.rd;
    cx.fillRect(302,this.by-18,356*hpp,10);

    // Trust bar
    if(this.boss.trust!==undefined){
      box(300,this.by-6,360,8,"#111",P.yl,1);
      cx.fillStyle=P.yl;
      cx.fillRect(302,this.by-4,356*(this.boss.trust/this.boss.trustReq),4);
      cx.fillStyle=P.yl;cx.font="10px monospace";cx.textAlign="center";
      cx.fillText(`Confiança ${Math.round(this.boss.trust/this.boss.trustReq*100)}%`,W/2,this.by+8);cx.textAlign="left"
    }

    // Battle box
    box(this.bx,this.by,this.bw,this.bh,"#000",P.wh,3);

    // Bullets
    for(const b of this.bullets){
      cx.fillStyle=b.c||P.rd;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill()
    }

    // Soul
    if(this.mode==="enemy") drawSoul(SL.x,SL.y,SL.r);

    if(this.mode==="enemy"){
      cText("DESVIE!",this.by+this.bh+18,14,P.rd)
    }

    // Actions
    const ay=420;
    const cols=[P.or,P.cy,P.yl,P.gn];
    for(let i=0;i<4;i++){
      const ax=80+i*200;
      const sel=this.sel===i&&this.mode==="player";
      box(ax,ay,140,40,sel?cols[i]:"#000",cols[i],2);
      cx.fillStyle=sel?"#000":cols[i];
      cx.font="bold 16px monospace";cx.textAlign="center";
      cx.fillText(this.actions[i],ax+70,ay+26);
    }
    cx.textAlign="left";

    if(this.mode==="player"){
      cText("Escolha sua ação",500,16,P.gy)
    }

    // Player HP
    cx.fillStyle=P.wh;cx.font="14px monospace";
    drawSoul(50,495,6);
    cx.fillText(`HP ${PL.hp}/${PL.maxHp}`,70,500);
    cx.fillText(`LV ${SV.d.lv}`,200,500)
  }
};

// Soul in battle
const SL={
  x:480,y:240,r:7,speed:2.8,
  update(){
    if(K.l)this.x-=this.speed;
    if(K.r)this.x+=this.speed;
    if(K.u)this.y-=this.speed;
    if(K.d)this.y+=this.speed;
    this.x=clamp(this.x,BT.bx+this.r,BT.bx+BT.bw-this.r);
    this.y=clamp(this.y,BT.by+this.r,BT.by+BT.bh-this.r)
  }
};

// ════════ BOSS CLASSES ════════
class BossB{
  constructor(nm,hp){this.nm=nm;this.hp=hp;this.mhp=hp;this.resolved=false;this.tk=0;this.tc=0;this.mc=0;this.ac=0;this.ready=false;this.tick=0}
  finish(mercy,title,lines){
    this.resolved=true;
    if(mercy){SV.d.mercies++;AU.mrc()}else{SV.d.kills++;AU.hit()}
    SV.d.bossState[this.nm]={mercy,killed:!mercy};
    // XP and LV
    SV.d.xp+=mercy?10:20;
    if(SV.d.xp>=SV.d.lv*15){SV.d.lv++;PL.maxHp+=5;PL.hp=PL.maxHp;SV.d.maxHp=PL.maxHp;AU.lvl();DL.quick(`LEVEL UP! LV ${SV.d.lv}`)}
    SV.d.phase=WR.phase+1;SV.d.hp=PL.hp;
    BT.end();
    showStory(title,lines,()=>{
      if(WR.phase>=3) showEnding();
      else WR.init(WR.phase+1)
    })
  }
}

      "O mundo digital continuou sem ele.",
      "E sem você."
    ])
  }

    const l=["Você não entende o que estou fazendo.",
      "Eu quero melhorar o mundo! Por que me impede?",
      "Mas... as pessoas que ficaram para trás...",
      "Eu... esqueci delas.",
      "Será que é tarde demais para voltar?",
      "Talvez... eu precise de alguém."];
    DL.quick(l[Math.min(this.tc-1,l.length-1)])
  }
  onAct(){this.ac++;this.trust=Math.min(this.trust+1,this.trustReq);AU.mrc();
    const l=["Você lembra do futebol na rua.",
      "Das conversas sem pressa.",
      "Das risadas que não precisavam de Wi-Fi.",
      "Do amigo que ele ainda pode ser."];
    DL.quick(l[(this.ac-1)%l.length])
  }
  onMercy(){
    if(this.trust<this.trustReq){DL.quick("Lucas ainda resiste. Fale mais com ele.");return}
    this.finish(true,"Lucas, Meu Melhor Amigo",[
      "Você não destruiu Lucas.",
      "Você o encontrou.",
      "Debaixo de todo aquele código, ele ainda estava lá.",
      "Assustado. Perdido. Mas humano.",
      "Vocês se olharam. Sem tela entre vocês.",
      "E pela primeira vez em muito tempo... ele sorriu."
    ])
  }
}

// ════════ STORY PANELS ════════
let storyData=null;

function showStory(title,lines,cb){
  state="story";storyData={title,lines,shown:[],idx:0,timer:0,done:false,cb}
}

function updateStory(){
  if(!storyData||storyData.done)return;
  storyData.timer++;
  if(storyData.timer%80===0&&storyData.idx<storyData.lines.length){
    storyData.shown.push(storyData.lines[storyData.idx]);
    storyData.idx++
  }
  if(storyData.idx>=storyData.lines.length&&storyData.timer>storyData.lines.length*80+80)
    storyData.done=true
}

function drawStory(){
  if(!storyData)return;
  cx.fillStyle="#000";cx.fillRect(0,0,W,H);
  cText(storyData.title,70,26,P.wh);
  cx.fillStyle=P.gy;cx.font="17px monospace";cx.textAlign="center";
  storyData.shown.forEach((l,i)=>cx.fillText(l,W/2,150+i*32));
  if(storyData.done&&Math.floor(frame/25)%2===0){
    cx.fillStyle=P.yl;cx.fillText("Pressione ENTER ou clique para continuar",W/2,480)
  }
  cx.textAlign="left"
}

function nextStory(){
  if(!storyData)return;
  if(!storyData.done){storyData.shown=[...storyData.lines];storyData.done=true;return}
  const cb=storyData.cb;storyData=null;if(cb)cb()
}

// ════════ BOOT ════════
function boot(){
  state="boot";fadeAlpha=1;
  setTimeout(()=>{state="menu";MN.init();fade(-1)},500)
}

// ════════ INPUT ════════
document.addEventListener("keydown",e=>{
  AU.res();
  if(e.key==="ArrowLeft"||e.key==="a")K.l=1;
  if(e.key==="ArrowRight"||e.key==="d")K.r=1;
  if(e.key==="ArrowUp"||e.key==="w")K.u=1;
  if(e.key==="ArrowDown"||e.key==="s")K.d=1;
  if(e.key==="e"||e.key==="Enter"||e.key===" "){K.a=1;
    if(state==="dialogue"){e.preventDefault();DL.next()}
    else if(state==="menu"){e.preventDefault();MN.confirm()}
    else if(state==="story"){e.preventDefault();nextStory()}
    else if(state==="credits"){e.preventDefault();state="menu";MN.init()}
    else if(state==="battle"&&BT.mode==="player"){e.preventDefault();BT.doAction()}
  }
  if(e.key==="Escape")K.c=1;

  // Menu/Battle nav
  if(state==="menu"){
    if(e.key==="ArrowUp"){MN.sel=(MN.sel+MN.opts.length-1)%MN.opts.length;AU.sel()}
    if(e.key==="ArrowDown"){MN.sel=(MN.sel+1)%MN.opts.length;AU.sel()}
  }
  if(state==="battle"&&BT.mode==="player"){
    if(e.key==="ArrowLeft"){BT.sel=(BT.sel+3)%4;AU.sel()}
    if(e.key==="ArrowRight"){BT.sel=(BT.sel+1)%4;AU.sel()}
  }
});
document.addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")K.l=0;
  if(e.key==="ArrowRight"||e.key==="d")K.r=0;
  if(e.key==="ArrowUp"||e.key==="w")K.u=0;
  if(e.key==="ArrowDown"||e.key==="s")K.d=0;
  if(e.key==="e"||e.key==="Enter"||e.key===" ")K.a=0;
  if(e.key==="Escape")K.c=0;
});

cv.addEventListener("click",e=>{
  AU.res();
  const r=cv.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width);
  my=(e.clientY-r.top)*(H/r.height);
  if(state==="dialogue")DL.next();
  else if(state==="story")nextStory();
  else if(state==="menu")MN.confirm();
  else if(state==="credits"){state="menu";MN.init()}
  else if(state==="battle"&&BT.mode==="player"){
    for(let i=0;i<4;i++){
      const ax=80+i*200;
      if(mx>=ax&&mx<=ax+140&&my>=420&&my<=460){BT.sel=i;BT.doAction()}
    }
  }
});

// Mobile
function bindM(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();K[key]=1;AU.res()};
  const off=e=>{e.preventDefault();K[key]=0};
  el.addEventListener("touchstart",on,{passive:false});
  el.addEventListener("touchend",off,{passive:false})
}
bindM("ml","l");bindM("mr","r");bindM("mu","u");bindM("md","d");
document.getElementById("ma").addEventListener("touchstart",e=>{
  e.preventDefault();AU.res();K.a=1;
  if(state==="dialogue")DL.next();
  else if(state==="story")nextStory();
  else if(state==="menu")MN.confirm();
  else if(state==="credits"){state="menu";MN.init()}
  else if(state==="battle"&&BT.mode==="player")BT.doAction();
},{passive:false});
document.getElementById("ma").addEventListener("touchend",e=>{e.preventDefault();K.a=0},{passive:false});

// ════════ MAIN LOOP ════════
function tick(){
  frame++;
  updateFade();
  DL.update();

  if(state==="menu") MN.update();
  else if(state==="world") WR.update();
  else if(state==="battle") BT.update();
  else if(state==="story") updateStory();

  // Draw
  cx.clearRect(0,0,W,H);

  if(state==="boot"){cx.fillStyle="#000";cx.fillRect(0,0,W,H)}
  else if(state==="menu") MN.draw();
  else if(state==="world"||state==="dialogue") WR.draw();
  else if(state==="battle") BT.draw();
  else if(state==="story") drawStory();
  else if(state==="credits") drawCredits();

  DL.draw();
  drawFade();

  requestAnimationFrame(tick)
}

boot();
tick();
</script>
